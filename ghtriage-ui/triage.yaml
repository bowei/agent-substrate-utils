    shortDescription:
      - Restore external volumes from a snapshot the template names
    description: >-
      Part of #1951. Stacked on #3772: review the last two commits.


      A template can now import a snapshot taken outside Substrate. `ExternalVolumeTemplate` gains
      `content_source.snapshot.storage_snapshot_id`, and each Actor of the template restores its
      volume from that snapshot on its first resume.


      ```yaml

      volumes:

      - name: data
        external:
          template:
            capacityBytes: 10737418240
            storageClassName: csi-nfs-sc
            contentSource:
              snapshot:
                storageSnapshotId: <snapshot-id>
      ```


      A tag's snapshot of the volume takes precedence over the template's:


      | Tag the Actor is created from | Volume restores from |

      |---|---|

      | `--with-volumes` | tag snapshot |

      | `--with-volumes=a,b` including the volume | tag snapshot |

      | `--with-volumes=a,b` excluding the volume | template snapshot |

      | no `--with-volumes`, or no tag | template snapshot |


      CreateActor fails with `FAILED_PRECONDITION` when the volume's driver cannot restore
      snapshots. It does not look the snapshot up, so a missing snapshot fails the first resume.


      `VolumeContentSource` is a union with one member so that other sources can be added without a
      new field.


      An older ate-api-server ignores `content_source` and drops it from the stored template on its
      next status write. The CSI volumes guide lists this under known limitations.


      AI use: drafted with an AI agent under my direction.



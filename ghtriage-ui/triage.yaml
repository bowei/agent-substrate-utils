  - link: https://github.com/agent-substrate/substrate/pull/3817
    shortDescription:
      - Add --openappa to install OpenAPPA guardrails at the egress gateway
    description: >-
      Adds `ate-setup deploy --openappa`, which installs
      [OpenAPPA](https://github.com/archestra-ai/OpenAPPA) guardrails at the egress gateway with one
      flag.


      OpenAPPA is an open-source information-flow policy engine for AI agents. It labels each agent
      session with who may read the data it has seen and how far that data is trusted. It then
      checks every tool call against those labels, so a session that read a private repository can't
      post to a public issue. The decisions come from declarative per-tool rules, not from a model.


      Running at the egress gateway, it checks every actor's MCP tool calls, whatever harness or
      image the actor runs, and refuses a call before it leaves the cluster. Its labels are keyed by
      the actor's verified identity.


      `--openappa` deploys OpenAPPA's runtime and ext_proc processor into `ate-system`, with a
      Service and a NetworkPolicy that admits only the egress gateway. It also points the additional
      egress ext_proc filter at that Service. A redeploy without the flag removes it. Options:


      - `--openappa-policy`: the operator's own `appa.toml`. The bundled default includes OpenAPPA's
      GitHub battery.

      - `--openappa-mcp-servers`: the MCP hosts to check.

      - `--openappa-runtime-image` and `--openappa-extproc-image`: image overrides.

      - Provider tokens go in an optional `openappa-provider-credentials` Secret.


      The guide is `docs/guides/openappa.md`.


      To make this possible, the additional ext_proc filter gets two generic opt-in settings that
      any processor can use:


      - `--experimental-additional-egress-extproc-allow-mode-override` lets the processor read the
      request and response bodies of the requests it picks, via `mode_override`. All other traffic
      stays headers-only, so long-lived SSE streams are never buffered.

      - `--experimental-additional-egress-extproc-timeout` sets the filter's timeouts.


      Without them the rendered filter is unchanged.


      The default extproc image, `ghcr.io/archestra-ai/appa-extproc`, is published starting with
      OpenAPPA's next release (archestra-ai/OpenAPPA#904). Its digest gets pinned once that release
      exists.


      Tested on a kind install deployed with `--openappa` alone and a locally built extproc image. A
      stock Claude Code actor read a file from a private repository through GitHub's MCP server.
      OpenAPPA then refused the agent's comment on a public issue, and a `curl` call from the same
      actor was refused the same way. Model API traffic stayed headers-only. The tests render the
      manifests and filter, parse the filter into the vendored `ExternalProcessor` proto, and cover
      the config validation and removal.


      AI use: AI-assisted, I reviewed and tested it.



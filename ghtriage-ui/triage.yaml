    shortDescription:
      - 'ateworker: write an empty VOLUMES snapshot without durable-dir volumes'
    description: >-
      #### Description

      A VOLUMES snapshot holds only durable-dir volumes. Without any mounted durable-dir volumes,
      the workers now write an empty snapshot. On resume the containers start fresh and external
      volumes keep their data on the volume.


      - `ateworker-gvisor` skips `runsc fs-checkpoint` when no durable-dir volumes are mounted, and
      `RestoreWorkload` already skips the filesystem restore when the snapshot has no `fs/` bundle.

      - `atelet` checks `DurableDirVolumeMounts` on the worker `WorkloadSpec` in
      `shouldHaveSnapshots` so unmounted template volumes match `buildWorkerWorkloadSpec`.


      #### Testing


      - Added `preferredFidelity:VOLUMES,noDurableDir` cases to `TestDurableDirLifecycle` (zero
      volumes across gVisor and microVM, including golden snapshots) and
      `TestExternalVolumeLifecycle` (external volume only).

      - Added unit tests for `shouldHaveSnapshots` in `cmd/atelet` and empty `VOLUMES` checkpoint
      reuse in `internal/ateworker`.



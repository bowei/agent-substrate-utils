    shortDescription:
      - 'ate-setup: attach service account CA and token when the issuer is the cluster API server'
    description: >-
      ate-api-server rejects every token on clusters whose service account issuer is the API server
      URL (for example Talos, `https://<control-plane-ip>:6443`).


      Root cause: `kubernetesJWTProvider` in `cmd/ate-setup/internal/steps/create.go` sets
      `certificateAuthorityFile` and `discoveryTokenFile` only when the issuer is exactly
      `https://kubernetes.default.svc` or `https://kubernetes.default.svc.cluster.local`. Any other
      issuer, including a correctly discovered one or one set with `--ateapi-expected-jwt-issuer`,
      is treated as external, so ate-api-server runs OIDC discovery against system roots with no
      token and fails.


      Fix: also attach the projected service account CA and token when the issuer host and port
      match the kube-apiserver URL from the rest config ate-setup uses. A missing scheme is treated
      as https and a missing port as the scheme default. The two `kubernetes.default.svc` names are
      still always in-cluster. GKE `container.googleapis.com` and other external issuers never get
      the CA or token. The same check is used for the `--ateapi-expected-jwt-issuer` path in
      `ensureAPIAuthenticationConfig`.


      Tests:

      - `TestBuildAuthenticationConfig`: an issuer equal to the API server URL (with and without a
      scheme in the rest config) gets the CA and token; GKE still gets neither when an API server
      URL is set.

      - New `TestIssuerNeedsInClusterDiscovery`: default names, API server URL, default https port,
      IPv6, GKE, unrelated external issuer, empty API server URL, port mismatch.

      - `TestEnsureAPIAuthenticationConfig`: explicit issuer flag matching the API server URL, alone
      and alongside extra `jwtProviders`.

      - `go vet`, `go test -race ./cmd/ate-setup/...` and golangci-lint on the touched package pass.
      No cluster test; a Talos or kubeadm smoke test would be the real confirmation.


      Compatibility: additive. Only newly generated `ate-api-authentication` configs on clusters
      whose issuer is the API server URL change, gaining the two optional fields ate-api-server
      already supports. GKE and kind installs render the same config as before. A valid hand-patched
      ConfigMap is still left alone when the issuer flag is unset (#3370 behavior).


      Known limitation: if ate-setup reaches the cluster through localhost, a port-forward or a
      ClusterIP kubeconfig, the host will not match the issuer and the old behavior remains. I'm
      happy to add an explicit setting instead of, or next to, the host match if maintainers prefer,
      as asked on the issue.


      Logging of the discovery failure is left to #3725.


      Fixes #3326



    shortDescription:
      - 'atelet: coalesce cold credential-provider execs'
    description: >-
      ## Summary


      Concurrent cold image pulls against the same container registry forked separate
      credential-provider subprocesses that stampeded node metadata and STS endpoints, and a
      throttled provider exiting 0 with an empty `auth` map or blank password poisoned the 1-minute
      response cache with anonymous credentials.


      - Coalesces concurrent cold credential-provider executions per registry (falling back to
      per-image flights when a plugin reports `Image` cache scope), using waiter-counted context
      cancellation that atomically deletes zero-waiter flights under `p.mu` so subsequent callers
      never join a cancelled flight.

      - Filters out blank-password entries before caching so empty/throttled responses are never
      cached.

      - Sets a 5 s `WaitDelay` on plugin subprocesses and retries transient HTTP 429/5xx throttling
      outputs with bounded jittered backoff.



        action: ADD
        reason: Allows setting --route-timeout=0 in atenet-router to disable absolute route deadlines
      - name: area/network
        action: ADD
        reason: Supports long-lived streaming HTTP responses through atenet-router
  - link: https://github.com/agent-substrate/substrate/pull/3540
    shortDescription:
      - 'benchmarking/sweperf: optionally retry ResumeActor when no worker has room'
    description: >-
      In sweperf, a ResumeActor refused because no worker has room (ResourceExhausted or
      Unavailable) fails the whole task. Near capacity most tasks fail while the node keeps serving
      resumes at the same rate. agentsession already has a retry budget for this.


      --sweperf-resume-retry-budget (default 0, off) retries those errors with 50ms-to-4s backoff
      until the budget runs out. The cap is above agentsession's 1s because a 1s cap sent 9.4
      refused attempts per successful resume. Retried refusals go to a new ResumeActorRefused row,
      and only the final attempt to ResumeActor. In the task record, resume_max_ms includes the wait
      when a resume was retried, and capacity_retries counts the refusals. Keep the budget at 0 for
      goodput and host-scale sweeps.


      1000 users, one c3-highcpu-192-metal node, 8 microVM workers, minutes 2-10:


      | Budget | Tasks OK | OK resumes/s | ResumeActorRefused/s | ResumeActor failures/s |
      ResumeWithRetry p50 / p95 |

      |---|---|---|---|---|---|

      | 0 | 302 / 1,091 (27.7%) | 7.70 | 0 | 4.65 | 5.53 / 13.95 s |


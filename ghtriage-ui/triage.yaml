  - link: https://github.com/agent-substrate/substrate/pull/3860
    shortDescription:
      - Begin to remove validation from DB layer
    description: >-
      This slipped in pre-1.0 and we didn't have time to fix it.  This PR is a few commits of a
      larger effort to clean up the DB and validation layers. 


      AI use:  Claude and Gemini helped author and test it.


      - [X] Tests pass

      - [X] Docs updated



      Commits:

          atepg: Add an AGENTS.md
          
      -----

          controlapi: Write ActorTemplates from the reconciler through ServiceImpl
          
          The ActorTemplateReconciler read and wrote ActorTemplates through the
          store, bypassing ServiceImpl. NewRPCService now also returns the
          ServiceImpl it builds, and ate-api passes it to the reconciler, so checks
          added to ServiceImpl also cover the reconciler's writes.
          
          ServiceImpl's ActorTemplate methods and AcquireLease only call the store,
          so the reconciler behaves the same.
          
          This makes some further cleanup of atepg and validation easier to review.
          
      -----

          ateapi: Do ActorTemplate update validation in Impl
          
          Previously the atepg layer checked some metadata fields on ActorTemplate
          updates using hand-written checks. Validation belongs in controlapi,
          where Actor updates already run declarative validation, and DV already
          marks atespace, name, uid and create_time immutable.
          
          ServiceImpl.UpdateActorTemplate and MarkActorTemplateForDeletion now
          follow the pattern in Actor, and wrap the mutate() function in
          validatedActorTemplateMutation, which validates the result as an update
          of the stored template. There is no update RPC for templates, so a
          failure is an internal error. The store no longer checks metadata.
          
          A nil mutate is allowed, as the store allows it. validatedActorMutation
          now allows it too.
          
          Added and updated tests.
          
      -----

          ateapi: Do Tag update validation in Impl
          
          Previously the atepg layer checked Tag updates using hand-written checks:
          metadata.name and metadata.atespace, status.actor_template_uid, and the
          status.snapshot transition. Validation belongs in controlapi, where
          ServiceImpl.UpdateTag already ran declarative validation, and DV already
          marks the metadata fields immutable.
          
          DV now covers the status rules too. status.actor_template_uid is
          immutable. status.snapshot has custom validation that allows it to be
          recorded once, and then only to move from PENDING to COMPLETED.
          status and status.snapshot may not be unset.
          
          ServiceImpl.UpdateTag and MarkTagForDeletion now follow the pattern in
          Actor, and wrap mutate() in validatedTagMutation. Failures stay API
          errors, because RPCService.UpdateTag merges the client's tag into the
          stored one. The store no longer checks Tags, so ErrImmutableField is
          gone.
          
          Added and updated tests.
          
      -----

          atepg: Don't allow name or atespace updates
          
          This will be cleaned up more later.
    currentLabels: []
    labels:
      - name: kind/cleanup
        action: ADD
        reason: Refactors validation out of the database store layer into controlapi

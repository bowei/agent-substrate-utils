      - #3399 removes `ate-setup`'s Cloud SQL support and the GKE content in
      `manifests/ate-install/base`. `render` relies on its config-load rejection of
      `ATE_API_POSTGRES_CLOUDSQL_*`, and its output has no GKE content once it lands.

      - #3396 removes `tools/setup-gcp` and `hack/teardown.sh`.

      - `--component` for render follows #3179.



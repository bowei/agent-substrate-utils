  - link: https://github.com/agent-substrate/substrate/pull/3462
    shortDescription:
      - '[performance] objectstorage: split 64-128 MiB sparse uploads into two range parts'
    description: >-
      ### Problem

      `sparsePartCount` truncated `populated / 64 MiB` to `1` for sparse snapshots in `[64 MiB, 128
      MiB)`. Because `PutSparseFile` requires `parts >= 2`, these snapshots fell back to
      single-stream `PutObject`, which reserves `512 MiB` on GCS (100% of `DefaultUploadMemory`) and
      serialized all uploads on the node to `concurrency = 1`.


      ### Solution

      Split sparse files into at least `2` parts once their encoded stream bound reaches `64 MiB`
      (`uploadCompositeMin`). `64–128 MiB` snapshots now use the 2-part `PutSparseFile` path and
      reserve `96 MiB` (`2 × 48 MiB`) instead of `512 MiB`, allowing up to 5 concurrent uploads per
      node (~3× higher throughput).


      ### Benchmark Results (`80 MiB` Sparse Snapshot, `DefaultUploadMemory = 512 MiB`)


      | Scenario | `main` (Before) | `sparse-upload-64m-parts` (After) | Improvement |

      | :--- | :--- | :--- | :--- |

      | **Memory reservation per `80 MiB` upload** | `512 MiB` (100% of budget, concurrency = 1) |
      **`96 MiB`** (18.75% of budget, concurrency = 5) | **-81% reservation (5× concurrency)** |

      | **1 actor (`80 MiB` `pages.img`)** | `66.8 ms/op` (`1,256 MB/s`, `118.7 MB/op` alloc) |
      **`59.9 ms/op`** (`1,401 MB/s`, `70.2 MB/op` alloc) | **1.12× faster, -41% heap alloc** |

      | **5 concurrent actors (`80 MiB` `pages.img` each)** | `394.9 ms/op` (`1,062 MB/s`, `568.9
      MB/op` alloc) | **`131.5 ms/op`** (`3,190 MB/s`, `325.7 MB/op` alloc) | **3.00× faster, -43%
      heap alloc** |

      | **4 concurrent gVisor snapshots (`80 MiB` + 6 metadata files each)** | `428.6 ms/op` (`600.1
      MB/op` alloc) | **`136.1 ms/op`** (`394.1 MB/op` alloc) | **3.15× faster, -34% heap alloc** |


      ### Testing

      - `go test ./pkg/objectstorage/...`

      - Added `80 MiB` (`two_ranges`) test case in `TestUploaderPlansFromPopulatedBytes` and updated
      `TestUploaderGCSSnapshotBurstFitsDefaultBudget` to exercise `[64 MiB, 128 MiB)` snapshots.
    currentLabels:
      - area/storage
      - area/benchmarking
    labels:
      - name: kind/bug
        action: ADD
        reason: >-
          Splits 64-128 MiB sparse snapshot uploads into at least two parts so GCS uploads do not
          serialize
  - link: https://github.com/agent-substrate/substrate/pull/3454
    shortDescription:
      - 'kubectl-ate, docs: clarify global viewer requirement for worker atespace filter'
    description: >-
      Workers are global objects (`can_list_workers` on `global:root` and `can_get` on
      `worker:<name>` both require `viewer` on `global:root`), and `-a`/`--atespace` on `kubectl ate
      get workers` and `kubectl ate top worker` filters the global worker list client-side to
      workers hosting actors in that atespace. When a caller without global `viewer` runs `kubectl
      ate get workers` (with or without `-a`), `kubectl ate get worker <name>`, or `kubectl ate top
      worker`, the RPC fails with `PermissionDenied` without explaining that workers are global
      objects requiring global `viewer` permission.


      Fixes #3292


      ## Summary


      ```text

      workerRPCError(msg, err)
        if status.Code(err) == codes.PermissionDenied
          return fmt.Errorf("%s: %w (workers are global objects and require global viewer permission)", msg, err)
        return fmt.Errorf("%s: %w", msg, err)
      ```


      Used by `listAllWorkers` (`get workers`, `top worker`) and `GetWorkersRunner.Run` (`get worker
      <name>`).


      ## Evidence


      - **Before:** `kubectl ate get workers` (with or without `-a team-a`), `kubectl ate get worker
      <name>`, and `kubectl ate top worker` with a non-global token failed with bare
      `PermissionDenied`, and `-h` / docs did not state that `-a`/`--atespace` requires global
      `viewer`.

      - **After:** `get workers`, `get worker <name>`, and `top worker` append `(workers are global
      objects and require global viewer permission)` on `PermissionDenied`, and the CLI help text,
      `docs/reference/kubectl-ate.md`, and `docs/guides/authorization.md` document the global scope
      requirement.


      ## Merge Danger


      **Door:** Two-way


      **Blast Radius:** Small (`cmd/kubectl-ate` worker error formatting, CLI help strings, and
      documentation)


      AI use: AI-assisted implementation and unit tests; reviewed and verified by @moficodes on Kind
      and GKE.



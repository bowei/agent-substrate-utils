  - link: https://github.com/agent-substrate/substrate/pull/3541
    shortDescription:
      - 'atenet: allow disabling the route timeout'
    description: >-
      Some workloads intentionally keep an HTTP response open while an agent runs a long turn or
      streams output. A finite absolute route deadline can cut those requests even while the stream
      is healthy, so Envoy supports setting a route timeout to `0` to disable that deadline and
      relying on an idle timeout for liveness.


      `atenet-router` already exposes `--route-timeout`, but its setter ignored every non-positive
      value. As a result, `--route-timeout=0` silently kept the five-minute default and operators
      could not select Envoy's documented disabled-timeout behavior.


      The flag does not need an additional sentinel or `Changed()` check. pflag initializes an
      omitted flag to `defaultRouteTimeout`, so omission remains five minutes while an explicit zero
      reaches the setter as zero.


      This change:


      - applies an explicit zero to the workload route's `timeout` field;

      - keeps the route idle timeout at five minutes when the absolute timeout is disabled, so a
      completely inactive stream still has a finite liveness bound;

      - preserves the existing `max(5m, route timeout + 30s)` idle timeout for positive values;

      - rejects negative `--route-timeout` values during configuration validation;

      - keeps direct negative setter calls from changing the current value; and

      - documents the zero behavior in the flag help and configuration comments.


      The default remains five minutes. Shutdown sizing remains independent of `--route-timeout`,
      and the outer CONNECT route's existing zero timeout is unchanged.


      Related to #3419.


      AI use: AI-assisted. I reviewed the complete diff, validated the review findings, and ran the
      tests below.


      Verification:


      - `go test -race -shuffle=on -count=3 ./cmd/atenet/internal/router -run
      '^(TestRouterConfigValidate|TestRouteTimeoutFlag|TestXdsServer_RouteTimeout|TestXdsServer_ConnectRoutes)$'`

      - `go test -race -shuffle=on -count=1 ./cmd/atenet/...`

      - `go run ./cmd/atenet router --help`

      - `git diff --check upstream/main...HEAD`


      - [x] Tests pass

      - [x] Docs updated

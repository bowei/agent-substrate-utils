  - link: https://github.com/agent-substrate/substrate/pull/3772
    shortDescription:
      - Restore an Actor's volumes from its tag's snapshots
    description: >-
      Part of #1951


      Third PR in the external volume snapshot series. It builds on #1849 and #3748, so all commits
      before "Restore an Actor's volumes from its tag's snapshots" belong to those PRs. Please
      review only the last three commits, starting at "Restore an Actor's volumes from its tag's
      snapshots".


      CreateActor no longer refuses a tag for a template with external volumes. On the first resume,
      each volume the tag captured is created from its snapshot. A volume the tag left out is
      created empty.


      ### CreateActor

      - Refuses a tag whose volume snapshot was taken by a different driver than the template's
      StorageClass uses. A finished tag with a missing handle fails with Internal.

      - CreateTag does not wait for snapshots to be ready, so CreateActor checks readiness. A
      snapshot recorded ready is used as is. Otherwise CreateActor asks the driver, and fails with
      FailedPrecondition while the snapshot is not ready or after it is deleted.


      ### Resume

      - Restores each captured volume from the handle the Actor copied from the tag.

      - If CreateVolume reports the snapshot is gone, as when the tag was deleted first, resume
      fails with FailedPrecondition.


      ### GetTag

      - Asks the driver about each volume snapshot the tag records as not ready, so callers can see
      when a tag can seed an Actor.

      - CreateActor and GetTag record a snapshot that has become ready on the tag, so later calls
      skip the lookup. A failed write is only logged.

      - A driver without ListSnapshots cannot report readiness. CreateActor then restores anyway,
      and CreateVolume fails if the snapshot cannot be used.


      ### Docs

      - The `Actor.source_tag`, `CreateTagRequest.volume_selection`, `GetTag` and `ready_to_use` API
      comments describe the restore.

      - `docs/reference/api-guide.md` and `docs/reference/kubectl-ate.md` cover creating an Actor
      from a tag with volumes.

      - `docs/guides/csi-volumes.md` has a new "Snapshotting Volumes with a Tag" section and the
      known limitation.


      ### Known limitation

      An ate-api-server from v1.0 drops `volume_snapshots` from the Actor and provisions its volumes
      empty, without an error. So a clone that first resumes on a v1.0 replica during the roll to
      this release, or after a rollback to v1.0, loses its restored volume contents. Fixing this
      would need a v1.0 patch, which an upgrade may skip. The limitation is documented in
      `docs/guides/csi-volumes.md`.


      ### Testing

      - Unit tests in `volumes_test.go`: `TestEnsureTagVolumeSnapshotsUsable`,
      `TestEnsureTagVolumeSnapshotsUsableReadiness`, `TestRefreshTagVolumeSnapshots` and
      `TestCreateActorVolumesNotFound`.

      - Functional tests in `functionaltest/actor_test.go` and `functionaltest/tag_volumes_test.go`.

      - New e2e suite `internal/e2e/suites/tagvolumes`. It uses a template with external volumes
      `data` and `cache`, and needs the ExternalVolumes gate and `csi-nfs-sc`. It checks that:
        - a tag of every volume restores both, a clone's writes don't reach the source, and the clone keeps its data after `DeleteTag`
        - `names: [data]` restores `data`, and `cache` starts empty
        - a tag without `volume_selection` restores nothing
        - two Actors from one tag don't share writes
        - a tag restores after its source Actor is deleted
        - `DeleteTag` removes the snapshot directories from the NFS server
      - The probe file helpers move from `combinedvolumes` to `internal/e2e`, so both suites share
      them.

      - Ran `tagvolumes` and `combinedvolumes` on kind with `--preview=ALL` and the NFS CSI driver.
      Both pass on gVisor and microVM.


      I used an AI coding agent to help write this change and its tests, and to draft this
      description. I reviewed the result myself.



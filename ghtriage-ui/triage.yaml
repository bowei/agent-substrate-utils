  - link: https://github.com/agent-substrate/substrate/pull/3865
    shortDescription:
      - Export oidcjwt to pkg/ for out-of-tree sandbox drivers (#3846)
    description: >-
      Why is this needed? (Or link the issue. Open one first for features, API, install or CI
      changes.)


      Out-of-tree sandbox gateways and compute drivers (such as the OpenShell driver) authenticating
      actors via an `ActorJwtSource` egress rule need to verify injected Actor JWTs against
      `ate-idp-server` OIDC discovery and JWKS endpoints without importing `internal/oidcjwt`. 


      Following the pattern established in #3358 for `pkg/objectstore/actorauthz`, this exports a
      public verifier API under `pkg/oidcjwt`:

      - `New(ctx, Config)` initializes the public verifier and fetches OIDC discovery and JWKS keys.

      - `Verify(ctx, rawJWT)` and `VerifyAt(ctx, rawJWT, now)` validate actor and worker-for-actor
      JWTs and extract Substrate actor claims (`ActorUID`, `Atespace`, `ActorName`, `Node`).

      - `hack/verify/package-deps.sh` is updated to ban cloud SDKs and client-go from `pkg/oidcjwt`.

      - `hack/verify/pkg-external-import.sh` builds and verifies the package from an external
      module.


      Fixes #3846



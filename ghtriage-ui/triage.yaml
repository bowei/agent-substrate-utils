    description: >-
      A cloud provider can't ship its own objectstore-plugin image into an install without patching
      our manifests. This adds the installation half of #3095 so a provider does it out of tree. It
      is fine to merge after v1.0.


      Part of #3095.


      - `--component DIR` (repeatable, `ATE_INSTALL_COMPONENTS`, `components` in a config file)
      composes a kustomize Component into every control plane apply, after ours. A missing directory
      or one without a kustomize Component is refused.

      - `storage.backend` (`--storage-backend`, `STORAGE_BACKEND`) is `gcs` (default), `s3` (kind
      only, the kind default) or `external`. Under `external` ate-setup removes the in-tree storage
      env from both `objectstore-plugin` sidecars, sets no snapshot transfer service account, and
      leaves the sidecar to a `--component`.

      - Under `external`, ate-setup stages no microVM assets. `--microvm-asset-location` names where
      the operator uploaded them, and the `microvm` SandboxConfig uses its scheme. Installing
      `microvm` without it fails with an error naming the flag.

      - `docs/reference/object-store-plugin-sidecar.md` documents what a plugin can rely on:
      container name, sockets and services, the probe, port 8445, the network policy, the cert
      mounts and trust bundle, and the manual asset upload. Everything else stays ours to change.

      - `docs/examples/object-store-provider-component` swaps in a placeholder image. A render test
      composes it, so a change to the contract fails our CI.


      Notes:


      - A provider image that is not `ko://` passes through both the prebuilt and the `ko resolve`
      paths unchanged. `TestResolveLeavesOtherImages` runs the real `ko resolve` to show it.

      - Under `external`, only the GCS credential exchange used the transfer service account (the
      control sidecar's `--transfer-service-account`), so nothing else needs it.

      - A `--component` patch is only checked when the first control plane apply renders, after the
      namespace, CRD and SandboxConfig applies. A bad patch stops the install there, and rerunning
      with the fixed component recovers. `differences.md` says so.

      - Later `deploy` commands need the same `--storage-backend` and `--component`; ate-setup does
      not read them back from the cluster.

      - Default `gcs` and kind `s3` installs render the same manifests as before.


      Tests: `go test -race ./cmd/ate-setup/...` and `hack/verify-all.sh` pass. The e2e suites were

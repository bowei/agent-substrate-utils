  - link: https://github.com/agent-substrate/substrate/pull/3854
    shortDescription:
      - '[Prototype] Send actor DNS to the egress PEP over DNS over HTTPS'
    description: >-
      Prototype for the DNS contract with the egress PEP discussed in #2313. This is a draft for
      discussion, not for merge.


      Today the worker's DNS relay checks each actor DNS query against the actor's EgressPolicy and
      resolves it itself, so a PEP that keeps its own policy cannot govern DNS. This prototype moves
      the decision to the PEP.


      ## What it does


      `--dns-egress-policy=enforce-in-pep` is a new mode. `enforce-in-atunnel` is unchanged.


      * atunnel's DNS relay applies no policy. It sends each query to the PEP as an RFC 8484 `GET
      /dns-query?dns=<base64url>` on the mTLS connection that carries the actor's CONNECT tunnels,
      and returns the PEP's response to the actor.

      * The `atenet-egress` ext_proc answers the query. It resolves a name the actor's EgressPolicy
      allows and answers any other name NXDOMAIN. The Envoy config does not change.

      * The relay answers SERVFAIL when the PEP gives no usable response.


      ## Findings


      On kind with a gVisor actor, the existing DNS and egress e2e tests pass unchanged in both
      modes.


      Median lookup latency inside the actor, three runs per mode:


      | Lookup | enforce-in-atunnel | enforce-in-pep |

      |---|---|---|

      | Allowed name | 0.51 ms | 3.03 ms |

      | Blocked name | 0.25 ms | 2.58 ms |


      Of the 2.5 ms added, about 1.1 ms is the `GetActor` call the PEP makes on every lookup, 0.13
      ms is re-verifying the certificate, and the rest is the extra hop.


      To reproduce, see [Measuring lookup
      latency](https://github.com/chuangw6/substrate/blob/dns-doh-pep-prototype/internal/atunnel/dns/readme.md#measuring-lookup-latency).


      AI use: AI-assisted (Claude Code). I reviewed and tested it.


      - [x] Tests pass

      - [ ] Docs updated
    currentLabels: []
    labels:
      - name: kind/design
        action: ADD
        reason: Draft prototype for evaluating DNS policy in the egress PEP over DoH (#2313)
      - name: area/network
        action: ADD
        reason: Routes actor DNS queries through atunnel to egress PEP
  - link: https://github.com/agent-substrate/substrate/pull/3853
    shortDescription:
      - Add opt-in control-plane lifecycle hooks on CreateActor and DeleteActor
    description: >-
      > **Proof of Concept (Stacked on #3655)**: The first 5 commits (`f2b82e1b`..`0280c40f`) belong
      to #3655. Only the last 6 commits (`32d1e086`..`f993a435`) belong to this pull request:

      > **[View diff of the 6 lifecycle-hook commits only
      (`0280c40f...feat/lifecycle-hooks`)](https://github.com/agent-substrate/substrate/compare/0280c40fc1f22d1abc104a381b3ef3d40e911cf0...shankgan:feat/lifecycle-hooks)**

      >

      > I will rebase onto `main` once #3655 merges.


      External control-plane services that integrate with Substrate (such as workload identity
      authorities, service registries, and admission controllers) need a way to run policy checks,
      stamp `metadata.annotations`, and allocate or clean up external per-actor state when an
      `Actor` is created or deleted, without polling `ListActors`.


      Add opt-in control-plane lifecycle hooks on `CreateActor` and `DeleteActor` behind the
      `LifecycleHooks` preview gate and the `--lifecycle-hooks-config` flag on `ate-api-server`:


      1. **`atepg` pre-assigned metadata (`32d1e086`)**: Preserve caller-assigned `metadata.uid` and
      `metadata.create_time` in `setCreateMetadata` when set by the control plane before insert so
      hooks observe the same `uid` and `create_time` that get persisted.

      2. **Wire contract (`0775ae5e`, `api/hook/v1/hook.proto`)**: Define
      `substrate.hook.v1.LifecycleHook` with two unary RPCs (`OnCreateActor` and `OnDeleteActor`).
      `OnCreateActor` receives the `Actor`, the resolved parent `ActorTemplate` as read-only
      context, and `caller_principal`, and returns `allowed`, `status_message`, and
      `mutated_annotations`. `OnDeleteActor` receives `(atespace, name, uid, caller_principal)` as a
      notification with an empty response.

      3. **Configuration and TLS 1.3 (`2b0bc6c0`, `cmd/ateapi/internal/lifecyclehook`)**: Parse
      `--lifecycle-hooks-config` (`maxWaitDuration` default `100ms`, max `250ms`; up to 8 hook
      targets with disjoint non-reserved `allowedAnnotationPrefixes`) and dial each target over TLS
      1.3 (`caBundle` or `caCertFile` + `serverName`, with `MTLS` client credentials reloaded via
      `credbundle.ClientLoader` or `TLSOnly`).

      4. **Parallel `HookDispatcher` and compensating rollback (`d607f7c2`)**: Fan `OnCreateActor`
      out to all configured hooks in a single parallel wave under `maxWaitDuration`. A hook blocks
      creation only by returning `allowed: false`; a hook that errors or times out is logged and
      skipped. Check returned annotation keys against the hook's `allowedAnnotationPrefixes` and
      Kubernetes qualified-name syntax. Return a `CreateOutcome` whose `Rollback` sends compensating
      `OnDeleteActor` calls in parallel to every hook that allowed the create or timed out.

      5. **`controlapi` integration (`0563453a`)**: When `LifecycleHooks` is enabled and
      `--lifecycle-hooks-config` is set, `CreateActor` acquires the non-blocking per-actor lease
      (`lease:actor:<atespace>:<name>`), verifies the name is free, resolves the template, tag
      source, and initial external volumes, calls `OnCreateActor`, re-validates the mutated actor
      against the `16`-key / `4 KiB` annotation bounds, and rolls back via a single `defer` if any
      hook denies, validation fails, or `store.CreateActor` fails. `DeleteActor` calls
      `OnDeleteActor` before removing the actor row. Golden actors created and deleted by
      `ActorTemplateReconciler` bypass hooks. When `--lifecycle-hooks-config` is unset,
      `CreateActor` and `DeleteActor` are unchanged.

      6. **End-to-end mTLS functional tests and benchmark (`f993a435`)**: Add
      `TestLifecycleHooksEndToEnd` and `BenchmarkCreateActorLifecycleHooks` in
      `cmd/ateapi/internal/controlapi/functionaltest/lifecycle_hooks_test.go` against three TLS 1.3
      / mTLS gRPC hook servers and PostgreSQL.


      ### Benchmark Summary (`BenchmarkCreateActorLifecycleHooks`)


      | Configuration | Latency (`ns/op`) | Throughput (`actors/s`) | Bytes (`B/op`) | Allocs
      (`allocs/op`) |

      | :--- | ---: | ---: | ---: | ---: |

      | `0_NoHooks` | `2,165,702` (`2.17 ms`) | `455.9` | `119,630` | `472` |

      | `1_SingleMTLSHook` | `6,086,269` (`6.09 ms`) | `163.4` | `363,711` | `1,011` |

      | `3_ParallelMTLSHooks` | `6,171,949` (`6.17 ms`) | `161.0` | `660,840` | `1,722` |


      Fixes #3819


      AI use: AI-assisted, I reviewed and tested it.


      - [x] Tests pass

      - [x] Docs updated

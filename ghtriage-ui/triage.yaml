    shortDescription:
      - 'atecontroller: emit Warning event when SandboxConfig deletion is blocked'
    description: >-
      When a `SandboxConfig` is marked for deletion while `WorkerPool` objects still use it,
      `SandboxConfigProtectionReconciler` keeps the `sandboxconfig.ate.dev/workerpool-protection`
      finalizer without recording why deletion is waiting. Because `SandboxConfig` has no `.status`
      subresource, `kubectl describe sandboxconfig` shows neither a status condition nor an event.


      Fixes #3280


      ## Summary


      ```text

      SandboxConfigProtectionReconciler.Reconcile
        if !sc.DeletionTimestamp.IsZero() && ContainsFinalizer(sc, workerpool-protection)
          pools := workerPoolsUsing(ctx, sc.Name)
          if len(pools) > 0
            Recorder.Eventf(sc, nil, Warning, "SandboxConfigInUse", "ReleaseSandboxConfig",
              "%s", formatWorkerPools(pools))
            return Result{}, nil
          removeProtectionFinalizer(ctx, Client, sc)
      ```


      `formatWorkerPools` formats one pool as `deletion blocked by WorkerPool "<namespace>/<name>"`
      and multiple pools as `deletion blocked by WorkerPools: "<ns1>/<p1>", "<ns2>/<p2>"`.


      ## Evidence


      - **Before:** Deleting an in-use `SandboxConfig` left it with `deletionTimestamp` set and
      `Events: <none>` in `kubectl describe sandboxconfig <name>`.

      - **After:** `kubectl describe sandboxconfig <name>` shows `Warning SandboxConfigInUse ...
      deletion blocked by WorkerPool "<namespace>/<name>"` (or `deletion blocked by WorkerPools:
      "<ns1>/<p1>", ...`), and removing or switching the `WorkerPool` releases the finalizer and
      completes deletion.


      ## Merge Danger


      **Door:** Two-way


      **Blast Radius:** Small (`SandboxConfigProtectionReconciler` event emission and
      `docs/reference/api-guide.md`)


      AI use: AI-assisted implementation and unit tests; reviewed and verified by @moficodes on Kind
      and GKE.



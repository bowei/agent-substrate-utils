    description: >-
      Why: `authz` is wired to PostgreSQL in four places: `NewOpenFGAServer` and `New` take a
      `*pgxpool.Pool`, `PolicyManager` methods take a `pgx.Tx`, and OpenFGA store/model provisioning
      serializes replicas with a `pg_advisory_lock`.


      This change makes `authz` backend-neutral without changing behavior; it is the first of a
      short series that makes the ateapi store backend selectable. Earlier discussion of pluggable
      storage is in #3203; this keeps `store.Interface` as the extension point and keeps resource
      rows and OpenFGA tuples in one transaction.


      What changes:

      - `NewOpenFGAServer(ds storage.OpenFGADatastore)`. The pgx datastore wrapper and
      `ContextWithTx`/`TxFromContext` move, otherwise unchanged, from `authz` to
      `store/atepg/pgfga`, next to the backend they belong to. `pgfga.New(pool)` builds it.

      - `EnsureStoreAndModel` and `New` take an `InitLocker` (`AcquireLease(ctx, key)`, which every
      `store.Interface` satisfies) instead of a pool. Provisioning holds the lease
      `lease:openfga:init`, retrying every second on `store.ErrLeaseConflict`, and runs under
      `lease.Context()`.

      - `PolicyManager.ReconcileGlobalBindings`, `ReconcileAtespaceBindings` and
      `DeleteAtespacePolicies` drop the `pgx.Tx` parameter and read it from `ctx`. `atepg` wraps
      `ctx` with `pgfga.ContextWithTx(ctx, tx)` at its six call sites, so tuple writes still commit
      in the same PostgreSQL transaction as the rows. `authz.ErrNilTransaction` is gone; the
      datastore enforces the transaction rule (`pgfga.ErrNoTransactionInContext`).

      - `go list -deps ./cmd/ateapi/internal/authz` no longer includes `github.com/jackc/pgx`.


      Behavior note for reviewers: the init lock becomes a 30 s TTL lease rather than a session
      advisory lock. If a replica is hard-killed while provisioning, its peers wait for the lease to
      expire instead of proceeding when the connection drops. Provisioning is idempotent and runs
      once per deployment; the wait is logged on every retry. Normal shutdown releases the lease
      immediately.


      Tests: the pgfga datastore transaction tests move with the code; `authz_test.go` builds its
      server on `pgfga.New` and uses an in-process `InitLocker`; new `synctest` cases cover waiting
      on a held lease and context cancellation while waiting. Ran `go test -race` for
      `cmd/ateapi/internal/store/...`, `authz/...`, `controlapi/...` and `cmd/ateapi` on the
      PostgreSQL 18 testcontainer, plus
      `hack/verify/{boilerplate,gofmt,golangci-lint,go-modules}.sh`.


      AI use: AI-assisted; I reviewed and tested it.


      - [x] Tests pass

      - [ ] Docs updated (none describe these internal APIs)

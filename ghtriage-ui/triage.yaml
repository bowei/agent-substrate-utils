  - link: https://github.com/agent-substrate/substrate/pull/3631
    shortDescription:
      - Avoid forcing snapshot writeback when the worker pod has free memory
    description: >-
      Fixes #3626


      Fixes a suspend regression in benchmarks after #3353 / #3485:


      - #3485 starts write-out of every snapshot as soon as it's taken. Because `atelet` only
      deletes the previous snapshot after the next one finishes, the disk is still writing ~520 MiB
      that is about to be unlinked when the next checkpoint starts, and that checkpoint stalls
      behind it in `balance_dirty_pages`. Before #3353 nothing forced the write, so the old
      snapshot's dirty pages were simply dropped when `atelet` deleted it.

      - `snapshotcache.StartWriteback` now takes a `flush func() (bool, <-chan struct{})`. While
      `flush` returns false, poll passes still close files that are clean or unlinked without
      starting write-out; `flush` is re-checked on each pass or immediately when its channel closes,
      and write-out restarts from the fast initial poll interval.

      - `memborrow.Ledger.Tight(lent)` starts background write-out once unbooked memory left after
      active loans drops to `limit/3`, or free pod memory drops below `margin`, and `Wait` closes
      its wakeup channel before blocking. `ateworker-gvisor` passes `Tight` as `flush`, while
      `ateworker-microvm` passes `nil` so write-out starts right away as before.
        - Why `limit/3` (hardcoded default for now, can be tuned or exposed later if workloads need it): I also tested `0` headroom (`unbooked - bytes < 0`), which kept roomy pods fast (`780ms` p99) but delayed write-out onto resume in 100% bin-packed pods (`7.8s -> 12.0s` p50), and a Linux `vm.dirty_ratio`-style `20%` dirty cap (`bytes >= limit/5`), which sped up bin-packed (`5.8s` resume p50) but tripped on back-to-back ~530 MiB checkpoints in a `4Gi` roomy pod (~26% overlap before `atelet` unlinks the prior snapshot, `14.0s` p99). `limit/3` unbooked headroom keeps roomy pods in page cache while starting write-out early on packed workers.

      Tested on GKE across gVisor and microVM (0 OOM kills, 0 worker restarts; preliminary benchmark
      results are posted in the comments below):

      - gVisor roomy (`4Gi` pod limit and no pod limit, 1 x 512Mi actor)

      - gVisor half-packed (`5248Mi` pod, 3 x 1Gi actors) and 100% bin-packed (`5248Mi` pod, 5 x 1Gi
      actors)

      - gVisor #3353 tight-pod OOM test (`1088Mi` pod, 4 x 256Mi actors, 6 concurrent waves)

      - microVM roomy (`4Gi` pod limit, 1 x 1Gi actor, and no pod limit, 5 x 512Mi actors)

      - microVM half-packed (`4272Mi` pod, 2 x 1Gi actors) and 100% bin-packed (`3236Mi` pod, 3 x
      1Gi actors; `1132Mi` tight pod)


      AI use: AI-assisted debugging, benchmarks, and implementation. I reviewed and tested
      everything.


      - [x] Tests pass

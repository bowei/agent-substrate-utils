  - link: https://github.com/agent-substrate/substrate/pull/3443
    shortDescription:
      - Worker overcommit PoC
    description: >-
      <!-- The PR title becomes the release note. Write it for users. -->


      > **Note:** This PR is a **Proof of Concept (PoC)** for worker-level resource overcommit,
      opened to share the prototype implementation, benchmark results, and gather design feedback
      for #3441.


      ### Summary


      Adds an opt-in PoC of worker-level resource overcommit (`--enable-overcommit`) where
      `ateworker` measures hosted actors' actual CPU and memory usage, predicts group resource needs
      over a sliding window, and returns unused headroom to `ateapi` for scheduling additional
      active actors.


      See #3441 for the problem statement, motivation, and full design discussion.


      ### How It Works


      - **Admission (`ateapi`)**: `BindActorToWorker` continues to book an actor's full declared
      limits into `worker.Status.Allocated` so concurrent scheduling decisions remain safe.

      - **Usage & Limit Scraping (`ateworker`)**:
        - `WorkloadStatsSample` (`internal/proto/ateworkerpb`) gains `cpu_limit_milli` and `memory_limit_bytes`, populated from `RunWorkloadRequest` / `RestoreWorkloadRequest` on all samples (including pending ones).
        - `overcommit.Controller` (`internal/ateworker/overcommit`) polls `GetActiveWorkloadStats` every `--overcommit-poll-interval` (default `5s`). First-seen actor UIDs are booked into the controller's `trackedAllocated` at their declared limits; consecutive samples compute CPU rate in millicores alongside memory working set; departed UIDs are dropped from tracking while keeping their booking in `trackedAllocated` so the same poll returns their remaining allocation.
      - **Usage Prediction (`internal/overcommit/predictor`)**:
        - Introduces the `Strategy` interface (`Predict(now, GroupUsageSnapshot)`).
        - Implements `WindowedMaxPredictor` using `--overcommit-maturation-window` (default `30s`) and `--overcommit-history-window` (default `5m`). Actors younger than the maturation window or lacking a CPU rate are predicted at their full declared limits. Mature actors have their usage summed per poll, and the predictor takes the peak of the group sum across the history window (separately for CPU and memory, capped at the mature group's combined limits).
      - **Allocation Adjustment (`ateworker` → `atelet` → `ateapi`)**:
        - Adds `AddWorkerAllocated` and `SubtractWorkerAllocated` to `ateletpb.WorkerSupport` and `ateapipb.WorkerService`.
        - `atelet` identifies the calling worker from the pod UID in its mTLS client certificate and forwards the delta to `ateapi`.
        - `ateapi` authorizes that the caller is the `atelet` on the worker's node, updates `worker.Status.Allocated` under the worker row lock (clamping subtractions at zero), and emits `WorkerEventUpdated`.
      - **Release (`ateapi`)**: When `--enable-overcommit` is enabled, `ReleaseActorFromWorker`
      frees only the actor slot (`AddActorCountOnly`) and leaves `Allocated.Resources` to be
      returned by `ateworker` on its next poll. Rebinding an actor on the same worker uses clamping
      subtraction (`SubtractResourcesFromAllocated`).


      ### Benchmark Results (`sweperf` on GKE)


      Measured on GKE (`us-central1-a`) with 2 × `c3-standard-8` gVisor worker nodes (1 worker per
      node, Guaranteed `7300m / 26Gi`) and `1 CPU / 2Gi` actors (static limit of 7 actors/worker, 14
      total with `OC-off`), under a 36-user Locust load (spawn 1/s, 25 min measured window)
      replaying recorded SWE-bench trajectories with think time. `ateworker` was run with
      `--usage-sample-interval=5s` (down from the `1m` default) so `GetActiveWorkloadStats` updates
      actor resource usage at the same cadence as the `5s` overcommit poll:


      | Workload | Avg Running Actors (OC-off → OC-on) | Sessions / Hour (OC-off → OC-on) |
      `Actor_Ready` Wait (OC-off → OC-on) | `Workload_Exec` Change | `Workload_Full` Change |

      |---|---|---|---|---|---|

      | **Single-task** (`astropy-14995`) | `14.00` → **`27.73` (+98%)** | `268` → **`510` (+90%)**
      | `110.7s` → **`53.1s` (−52%)** | **+1.1%** (`25.97s` → `26.25s`) | +0.2% |

      | **5-task mix** (5 SWE-bench tasks) | `14.00` → **`35.89` (+156%)** | `205` → **`502`
      (+145%)** | `89.6s` → **`1.02s` (−99%)** | **+12.7%** (+11.0% to +13.8% per task) | +0.4% to
      +1.4% |


      Neither run experienced failures, OOM kills, restarts, or evictions. In the 5-task mix,
      packing reached 18 actors/worker at p50 (max 22, limited by 36-user demand rather than cluster
      capacity), which eliminated slot waiting (`89.6s` → `1.02s`) at the cost of +11.0% to +13.8%
      in-actor execution time from overlapping CPU bursts.


      ### Open Questions


      This PoC leaves several design questions open for v1 (see #3441 for full details and
      discussion):


      - **Configuration & enabling scope** (cluster-wide flags vs. per-`Worker` / per-`WorkerPool`
      configuration)

      - **Resource pressure, OOM protection, and over-capacity booking**

      - **Polling timing gaps** (short-lived or same-UID checkpoint/restored actors between polls)

      - **Declared limits in `WorkloadStatsSample` vs. direct `ateworker` lifecycle hooks**

      - **Worker allocation adjustment API shape** (`AddWorkerAllocated` / `SubtractWorkerAllocated`
      deltas vs. declarative reporting)



    shortDescription:
      - 'atecontroller: add spc_t as default security context for SELinux'
    description: >-
      Worker pods mount the /var/lib/ate hostPath. On nodes that enforce SELinux, that directory is
      labeled container_var_lib_t and the default container_t type may neither read nor write it, so
      workers fail as soon as they touch atelet's state.



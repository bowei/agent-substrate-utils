  - link: https://github.com/agent-substrate/substrate/issues/3760
    shortDescription:
      - Support configurable /dev/shm tmpfs sizing
    description: >-
      Hi, I'm using agent-substrate with Cloud Hypervisor for agent workspaces that run Chrome and
      suspend when idle.


      Our Chrome workloads need more than the default 64 MiB `/dev/shm`. We currently carry a small
      worker patch to make the size configurable and use 1 GiB.


      I saw #3533 recommends mounting a `durableDir` at `/dev/shm` when more space is needed. For
      our use case, we also need shared-memory mappings to survive MEMORY suspend/restore after
      terminating the source VM and virtiofsd.


      We tested a durable volume through virtio-fs against native guest tmpfs on our existing trial
      runtime. After a completed MEMORY checkpoint and restoration on a replacement worker Pod:


      - Native guest tmpfs preserved the kept, unlinked and replaced-path mapping cases.

      - The durable volume preserved the kept file, but accessing the original unlinked mappings
      produced SIGBUS.


      This was on our pre-v1.0.0 trial build, with the durable volume mounted at a separate path. We
      haven't tested the v1.0.0 `/dev/shm` override itself or host-tmpfs backing. This appears to be
      the same open-but-unlinked-file limitation discussed in [virtiofsd
      #257](https://gitlab.com/virtio-fs/virtiofsd/-/work_items/257).


      Would you consider exposing `/dev/shm` tmpfs size in the actor/container configuration, while
      keeping the existing default? We'd like to keep it in guest memory so it travels with the
      MEMORY snapshot, without maintaining a custom worker patch.
    currentLabels:
      - area/api
      - kind/feature
      - area/microVM
    labels:
      - name: area/gvisor
        action: ADD
        reason: Actor features apply to both gVisor and microVM runtimes
      - name: area/node
        action: ADD
        reason: Propagates /dev/shm mount size through atelet OCI spec generation

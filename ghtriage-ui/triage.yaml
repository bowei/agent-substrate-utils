  - link: https://github.com/agent-substrate/substrate/pull/3407
    shortDescription:
      - MicroVM restores retry a stalled CRNG reseed on a fresh agent connection
    description: >-
      Under a dense restore load, a restored guest sometimes leaves the CRNG reseed request
      unanswered for several seconds, while a new connection to the same agent answers at once. The
      restore makes one reseed call bounded by 60 s, so one stuck call holds the restore and its
      worker slot, and the wake can time out at the router. #2743 stopped a slow reseed from
      crashing the actor by waiting up to 60 s. This keeps that budget but retries on a fresh
      connection instead of waiting on a stuck call.


      - The reseed runs in attempts of at most 1.5 s, within the same 60 s budget.

      - The first attempt uses the activation's agent connection, which stays open as before. Each
      later attempt dials a fresh connection with `dialAgentRetry`, sends the same nonce, and closes
      it.

      - Attempts are at least 100 ms apart. It stops at once if the caller's context ends or the
      guest has stopped.

      - Egress still opens only after a successful reseed. A reseed that never succeeds fails the
      restore, and a guest that stops during the reseed is still reported as Unavailable, as before.

      - `reseedGuestCRNG` and its constants move from `restore.go` to `reseed.go`. The only other
      change in `restore.go` is the call site.


      This touches the same call site as #3012 and #2504. I'll rebase onto whichever merges first.



    description: >-
      Release artifacts, Helm charts and provider CI need the manifests that deploy ate-system
      applies, without access to a cluster. render ate-system writes them to --output-dir, one file
      per apply step, numbered in apply order. It requires --image-repo and --image-tag and pins
      every image to a digest.


      It also writes the settings ConfigMaps that deploy creates through the API, and
      ate-api-server-secret-envvars for the bundled database. An external database's connection
      strings are not written.


      It leaves out the CA and JWT pool Secrets, which each hold a private key generated for one
      cluster: rendering them would put the keys wherever the output goes, and every apply would
      replace the pools and invalidate the certificates and tokens issued from them. deploy creates
      each pool only when it is absent, and actor-id-ca-certs is copied from the actor-id-ca-pool
      Secret in the cluster. It also leaves out the credential provider's namespace policy, the
      bundled PostgreSQL identities and the CSI drivers.


      deploy ate-system now builds the podcertificate-controller manifest, the ate-api-server
      settings and the service account issuer through the same helpers as render.


      Part of #3240.



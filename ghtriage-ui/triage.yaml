  - link: https://github.com/agent-substrate/substrate/pull/3763
    shortDescription:
      - 'feat(microvm): report guest OOM kills from the kata-agent OOM event'
    description: >-
      Updates #3615 (first step of the proposal). Part of the bug-bash follow-ups around microVM
      observability.


      ## Problem


      When a container inside a micro-VM goes over its memory limit (or the guest runs out of RAM),
      the guest kernel kills it and nothing on the host notices: the VM keeps running, the actor
      stays RUNNING, no worker log or crash report fires, and the workload just goes silent. gVisor
      already reports the equivalent condition (#3106); microVM had no equivalent because nothing
      ever calls kata's `GetOOMEvent`.


      ## Change


      Wire up the kata-agent's `GetOOMEvent` RPC, exactly as the kata shim consumes it:


      - `AgentClient.GetOOMEvent` (`internal/kata/agentclient.go`): one long-blocked ttrpc call that
      the agent answers only when a container in the sandbox is OOM-killed, returning the killed
      container's id. It multiplexes over the existing agent connection (the same one the
      stdout/stderr forwarding goroutines read), so it costs no extra channel.

      - `watchOOMEvents` (`cmd/ateworker-microvm/oom.go`): one goroutine per running actor, started
      next to `watchVM` on both the cold-boot and the restore paths. On an event it logs a WARN with
      the actor's `ateattr.ActorLogAttrs` identity and the killed container's name (a new
      `workloadNames` id→name map on `runningActor`; an unknown id falls back to the raw guest
      container id).

      - The watch ends with the agent connection: teardown nils and closes the agent under
      `actorsMu` (the watcher copies it out under the same lock, the way the graceful-shutdown drain
      does), and a VM death fails the in-flight call while `watchVM` reports the crash. No log line
      per torn-down watch — that would be noise on every actor shutdown.


      ### Deliberately left out of this PR


      The other two steps of the issue's proposal, so they can be settled in the issue rather than
      pre-decided here:


      - **Actor state on a guest OOM kill** (proposal step 2): moving the actor out of RUNNING
      builds on #2972's container-exit → CRASHED machinery, which is still open — happy to follow up
      once that direction lands.

      - **console.log tail before cleanup** (proposal step 3): tracked as #2212 item 6 and touches
      the shared teardown/cleanup paths, so it deserves its own change.


      No guest-side changes are needed: the vendored kata-agent already exposes `GetOOMEvent`, and
      it fires for both repro cases in the issue (a container over its own cgroup limit, and
      guest-RAM exhaustion — `memory.events` oom_kill increments in the killed process's cgroup
      either way).


      ## Testing


      New unit tests, all passing under `-race`:


      - `internal/kata`: `GetOOMEvent` round-trip against a fake ttrpc agent (the same harness the
      existing `ReseedRandomDev` tests use — the RPC guards the exact service/method names, since a
      wrong name would make every guest OOM silently invisible), and the connection-close error path
      teardown relies on.

      - `cmd/ateworker-microvm`: the watcher logs the WARN with actor + container attributes
      (unknown container falls back to its id), ends when the agent connection closes, and exits
      without issuing a call for a stopping actor. A `vsockHandshakeListener` test helper lets
      `kata.DialAgent` dial a plain unix socket through the hybrid-vsock CONNECT handshake.


      ```

      go test -race ./cmd/ateworker-microvm/...

      ok  go.ate.dev/substrate/cmd/ateworker-microvm 2.024s

      ok  go.ate.dev/substrate/cmd/ateworker-microvm/internal/kata 1.117s

      ... (all packages pass)


      golangci-lint run ./cmd/ateworker-microvm/... -> 0 issues.

      ```


      This change was developed with AI assistance, reviewed and tested by me.

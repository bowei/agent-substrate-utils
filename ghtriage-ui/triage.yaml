      Managed Kubernetes offerings may publish an OIDC discovery document whose jwks_uri points at
      an API-server load balancer VIP that is unreachable from the pod network (observed on ACK,
      where the SLB whitelist covers node subnets but not pod CIDRs). Every JWT verification then

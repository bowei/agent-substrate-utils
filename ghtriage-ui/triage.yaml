    shortDescription:
      - 'benchmarking: add the nighthawk-egress adaptive capacity runner'
    description: >-
      The egress gateway has a manual Nighthawk setup in `benchmarking/nighthawk-egress`, but no
      benchmark that searches for its capacity. The scheduled benchmark job gets one in three steps:
      the runner here, then the test type, then the suites.


      Add `runner.py` to benchmarking/nighthawk-egress as the entry point of the runner image. For
      one egress mode (`http`, `mitm` or `passthrough`), it runs one adaptive Nighthawk session
      against `nighthawk_service` in the `nighthawk/tester` actor, and uploads the session output. 


      Nothing calls the runner until the test type and the suites merge. The gateway counter checks
      of the issue come in a later PR.



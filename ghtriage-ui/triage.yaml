  - link: https://github.com/agent-substrate/substrate/pull/3635
    shortDescription:
      - 'k8s credential provider: add cache of secret values and labels'
    description: >-
      #3609 


      ### Why

      The k8s credential provider read the Secret from the API server on every `FetchSecret`, which
      is once per injected header per egress request. A busy actor spent the provider's
      `--kube-api-qps` budget re-reading the same Secret.


      ### What changed

      The provider now caches each Secret it reads, keyed by namespace and name, for
      `--secret-cache-ttl` (default 10s, 0 disables). A cache entry holds the Secret's labels and
      data, so all keys of one Secret share a read. Concurrent misses for one Secret share a single
      `Get` through singleflight.


      Authorization still runs on every fetch. The namespace and label checks use the cached labels,
      so a Secret cached for one atespace is still refused to an atespace whose grant does not cover
      it.


      A rotated, relabeled or deleted Secret can take up to the TTL to take effect. The egress
      credential injection guide notes this.



      AI-use: I used AI to create the change. I reviewed the diff.



      - [x] Tests pass


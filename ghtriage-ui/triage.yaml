    shortDescription:
      - >-
        New actors go to the worker with the fewest actors per CPU core, counting suspended actors
        still bound to its node
    description: >-
      Fixes #3528


      1. A suspended actor now keeps its assignment on the worker, marked suspended, while it's
      bound to that worker's node. 

      2. `WorkerStatus.assignments.total` counts them, and a new placement prefers the worker with
      fewer assignments per CPU core. 

      3. Suspended assignments don't count against capacity (`allocated`), and a resume pinned to
      the node still prefers the worker that kept the assignment.


      API changes:

      - `ActorAssignment.state`, `RUNNING` or `SUSPENDED`. Unset reads as `RUNNING` for backwards
      compat

      - `WorkerStatus.assignments.total`

      - `ListWorkerAssignments` and `GetWorkerAssignment` include suspended assignments

      - A worker without CPU capacity is not scheduled. Every ready WorkerPool worker reports one,
      the node's allocatable when the pod sets no cpu limit


      **Upgrading from rc.1 works**, an unset total is counted from the worker's assignments, and a
      maintenance pass repairs totals that drift while both versions run. While they do, an rc.1
      replica can't resume an actor rc.2 just suspended, the next resume works. That handling goes
      away after rc.2, so upgrades from rc.1 must go through rc.2. **Don't downgrade to rc.1 after
      this, it can't resume actors that rc.2 suspended**.


      Tested with isolate:

      - Cold resume throughput on the fake data plane, saturating a 2 CPU ate-api-server: 253, 244
      and 255/s vs 260, 247 and 254/s on main on 3 clusters, same latency, no postgres deadlocks.


      <details>

      <summary>Cold resume ladder on the fake data plane (2 CPU ate-api-server, 100-1500
      resumes/s)</summary>


      | cluster | main resumes/s | this PR resumes/s | postgres commits/s |

      |---|---|---|---|

      | 1 | 260 | 253 | 6770 -> 6860 |

      | 2 | 247 | 244 | 6440 -> 6620 |

      | 3 | 254 | 255 | 6640 -> 6930 |


      Throughput at saturation, the ate-api-server CPU limit. Latency is the same on both, no
      postgres deadlocks.

      </details>



      Tested on GKE with 5x c3-standard-4 nodes and 4 gVisor workers:

      - Placement: 12 rounds per cluster of starting 6 agentsession actors, which spend most of
      their time suspended. Every worker got 1 or 2 actors in 19 of 24 rounds, vs 4 of 12 on main.
      No worker got 3 in any round, vs 5 of 12 on main.

      - `assignments.total` matched each worker's assignments after every round and went back to 0
      once the actors were deleted. After upgrading from main in place with actors running, the
      totals matched again within a minute.

      - Cold resume throughput on the fake data plane, 3 clusters: 253, 244 and 255/s vs 260, 247
      and 254/s on main, no postgres deadlocks.

      - gVisor e2e: no new failures vs main. The tests that fail on both need egress MITM, a
      snapshot location and platform metrics, which these clusters don't set up.


      AI use: AI-assisted, I reviewed and tested it.

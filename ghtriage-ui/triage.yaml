  - link: https://github.com/agent-substrate/substrate/pull/3777
    shortDescription:
      - 'ateapi: select highest-fidelity worker in a single Schedule pass'
    description: >-
      Fixes #3779 


      Resuming an actor from a memory snapshot could scan the worker fleet twice. The scheduler
      first looked only for workers able to restore the snapshot's memory state. If none had room,
      it dropped that requirement and scanned again, accepting any worker of the same sandbox class
      for a cold boot from the snapshot's files. Each scan locks the worker cache and copies the
      fleet, and the retry had to be mirrored wherever an existing assignment is re-checked.


      The scheduler now does this in one pass. It rates each worker by how much of the snapshot it
      can restore and keeps only the best-rated workers that have room. A worker that can restore
      memory state always wins over one that can only cold boot, and the existing random choice
      applies within that group. Callers state up front whether a cold boot is acceptable.


      The set of workers an actor can land on and the choice among them are unchanged. Only the
      number of scans changes.


      AI use: AI-assisted, I reviewed and tested the changes.


      - [x] Tests pass

      - [ ] Docs updated (none needed; the existing docs already describe the cold-boot fallback)

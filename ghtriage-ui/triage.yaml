  - link: https://github.com/agent-substrate/substrate/pull/3823
    shortDescription:
      - 'atenet: add opt-in warm actor route cache'
    description: >-
      ## Summary


      Every ingress request routed through atenet-router currently invokes `ResumeActor` on
      ate-api-server even when the target actor is already running on a known worker, turning warm
      request routing into control-plane RPC and PostgreSQL load.


      - Adds an opt-in `--warm-route-cache-ttl` flag (0 by default, Envoy dataplane only) backed by
      a bounded 65,536-entry LRU cache on `ActorResumer`.

      - Stamps `x-ate-actor-uid` on routed requests and verifies it in worker atunnel ingress
      (ignoring unset `"-"` placeholders during rolling upgrades) so stale cached routes cannot
      cross into a recreated actor sharing the same `(atespace, name)`.

      - Enables Envoy `ResponseHeaders` inspection when `--warm-route-cache-ttl > 0`: when atunnel
      responds with HTTP 421 (`X-Ate-Assignment-Stale: true` in direct H2 mode) or Envoy generates a
      local reply (including `CONNECT` tunnel rejections and upstream connection failures), Envoy's
      external processor evicts the cached route, marks any concurrent `ResumeActor` flight
      invalidated so it cannot publish a stale placement, and rewrites direct-H2 421 responses to
      503 Service Unavailable (`codes.Unavailable` for gRPC callers). Application 404/5xx responses
      from inside the actor lack `X-Ate-Assignment-Stale` and do not evict the cache.


      ## Verification


      - `go test -race -count=3 -shuffle=on ./internal/atenet/... ./internal/atunnel/...
      ./cmd/atenet/...`

      - `./hack/verify/boilerplate.sh && ./hack/verify/gofmt.sh && ./hack/verify/package-deps.sh`


      🤖 PR was made with the use of generative AI.

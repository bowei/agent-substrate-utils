  - link: https://github.com/agent-substrate/substrate/pull/3577
    shortDescription:
      - 'atunnel: reuse persistent gRPC client connection to atelet for egress policies'
    description: >-
      Fixes #3575 


      On dense nodes (~5,000–6,000 actors), `ateworker` pods flood `atelet` with connection requests
      over `/var/lib/ate/worker-support.sock`. This exhausts the UNIX domain socket listen backlog
      and causes mass connection drops:

      - `dial unix /var/lib/ate/worker-support.sock: connect: resource temporarily unavailable`
      (`EAGAIN`)

      - `context deadline exceeded while waiting for connections to become ready`


      #### Cause

      In `internal/atunnel/egresspolicy.go`, every actor egress policy lookup (running on a 5-second
      TTL per actor) called `ateletdial.Dial(...)` and `defer conn.Close()`. 


      At 6,000 actors across 8 worker pods, this created **~1,200 short-lived TLS-over-UNIX
      connections every second** across the node. Each query performed a brand new socket
      `connect()`, a full TLS 1.3 handshake, 1 RPC, and tore it down. When bursts of actors
      refreshed simultaneously, `atelet`'s socket accept backlog was overrun.


      So this pr:
         - Adds `SupportConn()` to `Tunnel` (`internal/atunnel/tunnel.go`), keeping a shared, thread-safe `*grpc.ClientConn` per worker pod.
         - `ActorEgressPolicy` reuses this connection across actor queries, leveraging HTTP/2 stream multiplexing.
         - Total node connection churn drops from **thousands of ephemeral connections/sec $\rightarrow$ 1 connection per worker pod**.
         - Recycles the shared connection every 10 minutes (`workerSupportMaxConnAge`), ensuring rotated worker SPIFFE certificates are automatically picked up.
         - If an RPC returns `codes.Unavailable` (e.g. if `atelet` restarts), the connection is automatically invalidated so the next query immediately redials.
         - Automatically redials if the underlying socket path changes (supporting unit test overrides).

      #### Testing
         - Added `TestTunnelReusesSupportConnection` to verify that concurrent calls reuse the same `*grpc.ClientConn` and that `InvalidateSupportConn` forces a fresh redial.
         - Ran `go test -v -race ./internal/atunnel/...` and `go test ./benchmarking/atunnel/...`: **All tests passed with zero race conditions.**
         - Verified clean compilation across `cmd/ateworker-gvisor`, `cmd/ateworker-microvm`, and `cmd/atelet`.
         - Added `BenchmarkActorEgressPolicyFetch` testing parallel actor egress policy fetches over the shared connection:
           ```text
           BenchmarkActorEgressPolicyFetch-24    38,389 ops    57,595 ns/op (~57 µs)
           ```
         - Reaches **19,000+ policy queries/sec** with sub-millisecond response latency, zero `EAGAIN` errors, and zero dropped sockets.


      AI use: AI-assisted, I reviewd and tested it.


      - [X] Tests pass

      - [ ] Docs updated

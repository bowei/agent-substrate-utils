    description: >-
      <!-- The PR title becomes the release note. Write it for users. -->


      `ReuseCheckpoint` accepted snapshot names from the completion marker that atelet then
      rejected. `os.Stat` follows symlinks, and `filepath.Join` accepts `..`, so the list can name a
      file outside the checkpoint directory. atelet rejects that list, the marker stays, and the
      next `CheckpointWorkload` returns the same list.


      Names now have to pass `ValidateSnapshotFileNames`, and `os.Root.Lstat` has to show a regular
      file. Any failure returns nil. gVisor and microVM `CheckpointWorkload` then take a fresh
      checkpoint, which clears the directory.


      Before this change, `TestReuseCheckpointSnapshotNames` failed for a symlink, a symlink
      directory, a `..` name, and a nested name. After it, `go vet ./internal/ateworker/` is clean
      and `go test -race -count=3 -shuffle=on ./internal/ateworker/` passes.



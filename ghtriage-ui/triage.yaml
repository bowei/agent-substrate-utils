  - link: https://github.com/agent-substrate/substrate/pull/3550
    shortDescription:
      - 'benchmarking/evaluate: a cel source that evaluates CEL over data read from runs'
    description: >-
      Part of #3298. Second of four: #3551 (merged), #3550 (this), #3552, #3592. Supersedes #2526
      (Nishanth's `tools/goodput`, co-authored here).


      A `cel` source reads run files with generic readers and evaluates standard CEL expressions
      into scalar values. Its `source_cfg` (pydantic models; each reader checks its own options)
      has:

      - `inputs`: each naming a generic reader and its options, read from this run or, with `test:`,
      from that test's run in the same invocation through `BenchmarkRunContext.paired_run`:
        - `json`: parses one JSON object file (`data`, `uri`).
        - `json_lines`: reads a JSON-lines or prefixed-JSON file (`lines`, `unparsed_lines`, `uri`) with optional `prefix`, `until` (stop-marker CEL predicate), `select` (record-filter CEL predicate), and `unique_by` (first-seen deduplication) so readers return bounded record lists before CEL runs.
      - `locals`: an ordered list of `{name, cel}` evaluated top-to-bottom. A local that fails is
      left out, so only what reads it fails, with the local's error.

      - `checks`: CEL predicates that must hold for the values to mean anything.

      - `values`: scalar outputs (doubles, bools, strings, or `null`).


      The source knows nothing about any benchmark's semantics: what is good, which run to compare
      against, and every formula live in the test entry. Goodput is expressed purely in config over
      `json` and `json_lines` (`benchmarking/evaluate/README.md`).


      `cel_env` enables the standard CEL math extension (`ext_math`, e.g. `math.least` and
      `math.greatest`) and adds one numeric helper, `percentile(xs, p)` over `list(double)` (raising
      on an empty list), alongside `round(x, digits)`. Loading compiles every expression with
      inferred local return types (including `timestamp` and `duration`). At run time, an unreadable
      input, a false check, or a value error makes the variable `invalid`.


      Changes from #2526:

      - A `SuspendActorAsync failed` line (async suspend, the default since #3097) counts as a
      suspend failure.

      - `config.json`'s modes become generic `cel` inputs, `locals`, `checks`, and `values` in the
      test entry. Strict and relaxed are two evaluations.

      - No static baseline identity, baseline files, CLI or GCS code.

      - Every value is present on every valid run, `null` when there is nothing to measure.


      Written this way, goodput matches the patched #2526 prototype on 245 stored Prow sweperf runs
      (and matches across all 252 stored primary runs in parity checks; runs without a paired 1-user
      run report `invalid`).


      AI use: I wrote this with an AI coding agent from the design, then reviewed the diff and
      checked the goodput numbers against the #2526 prototype on stored Prow runs.
    currentLabels: []
    labels:
      - name: kind/feature
        action: ADD
        reason: Adds CEL expression evaluator over benchmark run artifacts (#3298)
      - name: area/benchmarking
        action: ADD
        reason: Implements generic run readers and CEL evaluation source

  - link: https://github.com/agent-substrate/substrate/pull/3824
    shortDescription:
      - 'ateapi/authz: add opt-in pure-Go short-circuit for bootstrap owners and mTLS system roles'
    description: >-
      In ateapi, bootstrap global owners (`--authz-bootstrap-owners`) and mTLS system principals
      (`--ingress-router-spiffe-id`, etc.) are static startup configuration injected as contextual
      tuples on every `Authorizer.Check` call rather than stored in AccessPolicy tuples. Even when
      no stored policy tuples are needed to authorize the call, `Authorizer.Check` builds contextual
      tuple protos and runs full OpenFGA graph evaluation (and PostgreSQL reads in production) on
      every RPC — most notably `ResumeActor` from atenet-router and lifecycle calls from bootstrap
      owners.


      Enabling OpenFGA's built-in `CacheController` check/iterator cache is unsafe here because
      OpenFGA compares cached-entry wall time against changelog `inserted_at` (PostgreSQL `NOW()`,
      which is transaction start time), allowing checks cached between a revoking transaction's
      `BEGIN` and `COMMIT` to survive invalidation for the cache TTL.


      Instead, this change adds an opt-in `--authz-pure-go-short-circuit` flag
      (`authz.WithPureGoShortCircuit`, default `false`) that evaluates immutable startup grants
      directly in Go inside `Authorizer.Check` with zero cache and zero TTL staleness:


      - **Bootstrap owners:** Short-circuits only structural objects validated by
      `resources.IsValidResourceName` (`global:root`, `atespace:<name>`, `worker:<name>`, and
      `<type>:<atespace>/<name>` for `actor`, `actor_template`, and `tag`) on the exact set of 44
      non-mint relations granted to `owner` on `global:root` in `model.fga` (explicitly excluding
      `can_mint_actor_jwt` and `can_mint_worker_actor_credential`).

      - **mTLS ingress router (`RoleIngressRouter`):** Short-circuits `principal.KindMTLS` callers
      holding `ingress_router` on `actor` `can_resume` and `global:root` `can_list_actors`.

      - **Fallback:** Any non-matching principal, relation, or object ID falls through unchanged to
      `checkRaw` / OpenFGA.

      - **Zero-Docker `model.fga` parity test:** `TestAuthorizerShortCircuitExactParityWithModelFGA`
      loads the embedded `model.fga` into an in-memory `storage.OpenFGADatastore` and verifies 0
      fail-open cases and exact `can_*` equivalence across every type and relation in `model.fga`
      during standard `go test` runs without requiring Docker.


      ### Benchmarks


      Replicable locally via `go test -bench` and
      [benchstat](https://pkg.go.dev/golang.org/x/perf/cmd/benchstat) comparing `HEAD~1` (in-memory
      OpenFGA evaluation without PostgreSQL network round-trips — a conservative lower bound on
      baseline cost) against `HEAD` (`pureGoShortCircuit` enabled):



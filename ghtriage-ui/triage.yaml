    shortDescription:
      - 'ateworker: report ready only after sandbox runtimes are registered'
    description: >-
      Fixes #3276


      `register.Report` stored the worker epoch immediately after `RegisterWorker` returned, before
      `reconciler.sync` read `sandbox-runtimes.json` and reported runtimes via
      `SetWorkerSandboxRuntimes`. When `atelet` could not write `sandbox-runtimes.json` (for
      example, when a `SandboxConfig` version failed to sync), `/readyz` still returned `200 OK`,
      Kubernetes marked the Pod `Ready`, and `ate-controller` marked the `Worker`
      `WORKER_STATE_ACTIVE` even though `scheduling.Registered` treated the `Worker` as unregistered
      (`SandboxClasses` empty). During a Deployment rollout, the new replica counted as available
      before it had a usable runtime, allowing Kubernetes to terminate healthy old replicas.


      Store the registered epoch inside the `SetWorkerSandboxRuntimes` wrapper in `run` after the
      RPC succeeds so `Epoch.Registered` and `Epoch.Require` stay unready until the control plane
      holds both the worker's capacity and its sandbox runtimes.





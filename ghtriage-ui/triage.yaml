    shortDescription:
      - Capture external volumes when a tag is created
    description: >-
      Part of #1951


      Second PR in the external volume snapshot series. It builds on the plugin snapshot methods
      from #1849, so the first 6 commits are that PR. Please review only the commits from "Capture
      external volumes when a tag is created" on. Tags can now snapshot the source actor's external
      volumes. Actors can't be created from such a tag yet. CreateActor still refuses tag cloning
      for templates with external volumes.


      ### API

      - `CreateTagRequest` gains `volume_selection`, an `ExternalVolumeSelection`. Left unset, no
      volumes are captured. Set to `{}`, every external volume is captured. `{names: [...]}`
      captures only the named ones. A name the actor has no external volume for fails with
      InvalidArgument, and selecting all volumes of an actor with none fails with
      FailedPrecondition, both before anything is copied.

      - The handles are recorded in the tag's `status.snapshot.volume_snapshots`, one
      `ExternalVolumeSnapshot` per volume, with `source_volume_id` and `ready_to_use`.

      - The new request field fails the `create-request-shape` lint, so
      `tools/apitool/exemptions.json` exempts it. `CreateOptions` doesn't exist yet and is meant for
      generic controls. This field is tag-specific, and an empty selection lets a client capture
      every volume without calling `GetActor` first.


      ### CLI

      - `kubectl ate create tag` gains `--with-volumes`. A bare `--with-volumes` captures every
      external volume. `--with-volumes=a,b` (comma-separated or repeated) captures only those. The
      names must be joined with `=`. If they are separated by a space, the command explains the
      mistake instead of failing with a generic argument-count error. It needs `--preview` while the
      ExternalVolumes gate is on.


      ### CreateTag

      - Checks first that every volume is provisioned and that its driver supports snapshots.

      - Records the volume list with no handles, takes the snapshots concurrently, then fills in the
      handles with one write.

      - Capture is all-or-nothing. On failure it records the handles it got and leaves the pending
      tag for DeleteTag. It does not wait for snapshots to become ready.


      ### DeleteTag

      - Deletes the volume snapshots before dropping the row.

      - For an entry without a handle, it re-issues the idempotent CreateSnapshot to recover the
      handle and deletes it. If the source volume is gone, it logs and skips. Transient failures,
      including ResourceExhausted, keep the row for a retry.

      - Recovers handles and deletes volume snapshots concurrently.


      ### Store

      - `status.snapshot` stays frozen once COMPLETED, except that a volume snapshot's
      `ready_to_use` may change from false to true. Before that, the volume list is fixed and each
      handle can be set once.


      ### Testing

      - Unit tests in `workflow_tag_volumes_test.go`, `tag_test.go`, `workflow_tag_test.go` and the
      CLI's `tag_test.go`.

      - Functional tests in `functionaltest/tag_volumes_test.go`, run with `-count=3 -shuffle=on`.

      - `hack/verify-all.sh` passes. `go test -race ./...` fails only in `atelet/internal/filecache`
      and `ateworker-microvm`, which fail the same way on `main` because of my local umask.


      I used an AI coding agent to port this change onto the current branch, address review
      comments, and draft this description. I reviewed the result myself.



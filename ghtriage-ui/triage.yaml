  - link: https://github.com/agent-substrate/substrate/pull/3839
    shortDescription:
      - 'objectstore-plugin: reload the exchange CA bundle on each handshake'
    description: >-
      ### Problem


      The node-mode GCS plugin parses the exchange CA bundle once into `tls.Config.RootCAs` in
      `exchangeclient.New`, so after the servicedns CA is rotated it keeps verifying the exchange
      against the old root. Token exchanges on nodes whose atelet predates the rotation fail with
      `Unavailable` and suspends crash the actor until atelet is restarted. The serving side already
      reloads per handshake.


      ### Fix


      Verify the exchange's certificate in `VerifyConnection` against `credbundle.PoolLoader`, as
      `ateapiauth.DialOptions` does, so a rotation applies on the next handshake. The startup load
      stays so a missing bundle still fails `New`.


      ### How tested


      New `TestNew_ReloadsTheCAFile`: stub exchange with a cert from a second CA, exchange fails,
      bundle rewritten with both roots, next call on the same connection succeeds. Fails on main.


      Fixes #3256


      AI use: AI-assisted, I reviewed and tested it. Experimented and verified with an AI agent.


      - [x] Tests pass

      - [ ] Docs updated (no user-facing change)

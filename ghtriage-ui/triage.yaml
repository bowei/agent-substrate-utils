  - link: https://github.com/agent-substrate/substrate/pull/3420
    shortDescription:
      - 'ateworker-microvm: optionally finish checkpoint teardown after the reply'
    description: >-
      Part of #3316.


      CheckpointWorkload waits for the VMM and virtiofsd to exit and cleans up the sandbox before it
      replies, so every microVM suspend waits for that cleanup.


      With the new `--async-checkpoint-teardown` worker flag, off by default, the worker does only
      the steps that touch the node-shared actor dir before the reply and finishes the rest in the
      background. #2529 moves atelet's delete of the superseded snapshot after the reply in the same
      way.


      - `child.Process.Kill` sends SIGKILL without waiting for the reap. `Stop` is now `Kill` plus
      the wait.

      - Before the reply, `beginAsyncTeardown` kills the VMM and virtiofsd, detaches the sandbox and
      bundle mounts, renames `rootfs-upper` to `rootfs-upper.deleting.<random>`, and calls
      `detachForTeardown`. The actor leaves the hosted set but keeps its draining slot and memory
      booking.

      - CheckpointWorkload hands its actor lock and inFlight token to the background teardown just
      before it returns.

      - The background teardown, at most `--async-teardown-workers` at once, waits for the reap,
      runs `cleanupSandboxState` and `finishUnhostActor`, deletes the renamed upper only if its
      device and inode still match, and removes older renamed uppers left by earlier teardowns. It
      releases the lock last, also after a panic.


      So the actor's next RPC on this worker starts only after the cleanup, capacity and memory stay
      booked until then, and shutdown (`WaitIdle`) waits for pending teardowns. A later activation
      on another worker pod only sees a new `rootfs-upper`, since the background teardown touches
      only this pod's processes, `/run` dirs, cgroup and netns, and the renamed dirs.


      The trade-off: an overloaded worker refuses work earlier, and a same-actor Restore or
      Terminate can wait behind the cleanup queue. If its caller gives up, it returns the context
      error.


      The flag is not exposed through WorkerPool yet; that is a follow-up.


      AI use: AI-assisted, I reviewed and tested it.



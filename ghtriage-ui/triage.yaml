  - link: https://github.com/agent-substrate/substrate/pull/3610
    shortDescription:
      - >-
        Resuming a microVM actor no longer reads its snapshot back from disk or waits behind other
        disk writes
    description: >-
      Fixes two resume regressions in our benchmarks after #3485:


      - after a snapshot, the microVM worker put the actor's memory.high back while the paused VM
      still held its memory. That forced the kernel to reclaim, and it evicted the snapshot it had
      just written (~186MiB in ~1s on one trace), so the next resume read it back from disk. We now
      put memory.high back after the VM is torn down. Found and fixed by @annapendleton.

      - atelet rewrote the actor's sandbox record on every restore by renaming a new file over it,
      and ext4 writes the new file out first, which waits behind whatever else the disk is writing.
      The record only names the actor's sandbox runtime and stays on the node with a local snapshot,
      so restoring from that snapshot writes the same bytes unless the runtime changed. We now skip
      the write when nothing changed.


      Tested on GKE (one run per build each):

      - 512Mi actor, Ubuntu c3-highcpu-4: resume p50 2649ms -> 698ms, suspend p50 3040ms -> 946ms

      - 3Gi actor, Ubuntu c3-standard-8: resume p50 15.1s -> 2.3s

      - ate_env density, 100 users on 4 workers, COS c3-standard-8: resume p99 550-570ms -> 450ms
      (before #3485: 480-490ms)


      AI use: AI-assisted debugging, benchmarks and the atelet change (both @annapendleton and I
      used agents). I reviewed and tested everything.


      - [x] Tests pass

      - [x] Docs updated

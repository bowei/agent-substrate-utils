  - link: https://github.com/agent-substrate/substrate/pull/3545
    shortDescription:
      - 'atenet: keep the capacity verdict when a parked resume ends on a lock conflict'
    description: >-
      `TestRequestParking` fails on the microVM e2e lane: the budget-exhausted 503 says "another
      operation is in progress for this actor" instead of "no worker has room for the actor". Three
      hits since 10-27, two of them on docs-only PRs. #1133 collects the lane's flakes.


      The router parks a resume on a capacity or availability error and retries it, and it retries
      Aborted too. When a retry hit another operation's lease on the actor, such as atelet reporting
      the snapshot upload of an earlier suspend, that Aborted replaced the error the request had
      parked on. If the budget ran out on that attempt, the 503 and a shed caller's outcome named
      the lock conflict. #606 reports the same Aborted reaching users after an ateapi crash.


      A parked request now keeps the capacity or availability error. A later Aborted keeps it parked
      without replacing that error.


      The new subtest `BudgetExpiryKeepsCapacityErrorOverLateConflict` fails without the change. The
      ingress package tests pass with `-race -count=3 -shuffle=on`.


      Written with Claude Code: it traced the flake through the CI logs and wrote the change and the
      test.

    description: >-
      Part of #3298. Third of four: #3551, #3550, #3552 (this), #3592. Stacked on #3550, so please
      review only the last two commits.


      Prow runs should record evaluations without a separate tool:

      1. `orchestrator.py` passes the full locust test entry to `runner.py` as `--test-entry` JSON
      instead of forwarding only selected fields, so runner features such as observers or
      evaluations can read their sections directly without adding a new flag per field.

      2. `runner.py` reads `evaluations` from `--test-entry`, creates the sources before the load
      test, and queries them as its last post-run step. `outputs.py` writes the `Report` to
      `evaluation.json` and appends an `evaluation_<name>` row per evaluation and an `evaluations`
      summary row to `stats.jsonl`. A row keys each value as `<variable>__<value name>`, so a
      variable name can't contain `__` or end in `_`. When evaluations don't load, the runner writes
      `error_report` with the error in `Report.error`. Evaluations never change `status.json` or the
      exit code. Goodput comes from the entries that declare it, replacing the plan in #2838. The
      locust image adds the `evaluate` package, `cel-expr-python`, and `pydantic`.


      `rundir.py` finds the run named by a `cel` input's `test` field, such as the suite's 1-user
      run: the latest run of that test under the same `--dest` with the same tag, at most 6 h older,
      on the same cluster. That needs `roles/storage.objectViewer` on the bucket, which a test-infra
      change grants. Without it, variables with such an input are invalid, and the reason says why.
      Runner and test-entry unit tests exercise the `json_lines` and list `locals` configuration
      format.


      AI use: I wrote this with an AI coding agent from the design, then reviewed the diff and
      checked the goodput numbers against the #2526 prototype on 248 Prow runs.

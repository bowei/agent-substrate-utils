  - link: https://github.com/agent-substrate/substrate/pull/3430
    shortDescription:
      - 'controlapi: handle actor template volume mismatches'
    description: >-
      Fixes #3401.


      An actor can outlive its template. Repointing it after deletion, or recreating the template
      under the same name, can leave its recorded external volumes inconsistent with the template.
      Resume then books a worker before failing, and Delete can fail on the same mismatch.


      Check recorded volume names when the old template is missing. Resume and workload construction
      share external-volume resolution, so the early check does not build a second workload spec.
      The final spec still uses the current attachment's PublishContext.


      Delete includes the actor's provisioned volumes and retains container identities when the
      template is available. Its fallback drops mismatched mounts and stays within the 32-volume
      limit. Cleanup also works after the ExternalVolumes gate is disabled.


      The name check cannot establish compatibility with a missing template's former mount paths or
      durable-dir layout. The API guide documents this limit.


      Validation:

      - Rebased onto main and adapted the tests to atomic worker assignments.

      - New deletion regressions fail without the fixes.

      - Affected Update, Resume, Delete, and volume-spec tests passed with `-race -count=3
      -shuffle=on`, including PostgreSQL and envtest.

      - Full race tests and the control-plane build passed.

      - All `verify-all` checks passed after initializing the validation checkout's Git metadata and
      rerunning the affected checks.


      Root-gated tests and runtime E2E were not run.



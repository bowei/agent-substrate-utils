  - link: https://github.com/agent-substrate/substrate/pull/3508
    shortDescription:
      - 'WIP: Rework ate-apiserver functional tests'
    description: >-
      Replaces the ate-api functional tests in `cmd/ateapi/internal/controlapi/functionaltest` with
      a black-box suite in `cmd/ateapi/internal/functionaltest`.



      ## Design


      - Tests are black-box. They call only the public gRPC API, over mTLS, and the harness. They
      never touch the store, `RPCService` or other ate-api internals. Old tests that need internal
      state, such as the lifecycle-op metric and span identity, moved into `controlapi`.

      - Each test calls `harness.New(t)` and gets its own ate-api, PostgreSQL database, Kubernetes
      namespace, nodes, fake atelets, fake object store and fake volume plugin. The envtest cluster
      is shared. Tests share no state, so every test runs with `t.Parallel()`.

      - The fakes support fault injection: `FailNext`, `Block`, and `HoldReply` with a gate the test
      releases. They return the gRPC codes a real atelet sends. This covers failure, retry and
      deadline paths.

      - Each test starts with a plain-language description of what it asserts, and the test
      implements it. Where today's behavior is wrong, the description states it and a `TODO:` says
      what the server should change.

      - `cmd/ateapi/internal/functionaltest/AGENTS.md` documents these rules for people and agents
      writing tests.


      ## Timing


      The new suite has 291 tests, against 149 in the old one.


      GitHub runners, `run-tests` job (`go test -race ./...` on `ubuntu-latest`):


      | Suite | Runs | Package time |

      |---|---|---|

      | Old | 6 runs on `main`, Nov 4-5 | 2m08s to 2m39s, median 2m20s |

      | New (289 tests then) | 1 run on this PR | 2m12s |


      `go test` runs at most `GOMAXPROCS` tests of a package at once, which is low on these runners.
      So CI time stays flat while the suite runs about twice as many tests.


      Local, `go test -race -count=1`, Intel i7-14700HX with 28 threads and 64 GB of RAM, 3 runs
      each:


      | Suite | Package time |

      |---|---|

      | Old | 97.3s, 100.4s, 99.5s |

      | New | 20.4s, 18.8s, 18.4s |


      With more cores, the new suite runs about 5x faster than the old one while running twice as
      many tests.


      ## Commits


      1. Move ate-api's server setup into `cmd/ateapi/internal/server`.

      2. Add `WithContextDialer` to `AteletDialer` and raise the test store's connection limits.

      3. Add the harness and the suite guide.

      4. Add the tests, one commit per resource.

      5. Delete the old suite.


      AI use: AI-assisted. I reviewed, edited and tested the changes by hand.

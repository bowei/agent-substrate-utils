      lifetime is independent of any actor. Later changes let templates reference one, record actor
      references on it, and add its delete trigger.


      - Resource, Postgres table (`000002_external_volumes.sql`, `ON DELETE RESTRICT` to atespaces),
      store methods and contract tests.

      - `Create/Get/List/DeleteExternalVolume`. Create needs the `ExternalVolumes` preview gate;
      Get, List and Delete work with the gate off, so turning it off cannot strand a record. Delete
      removes the record only; the storage stays.

      - OpenFGA `external_volume` type. Registering a volume is reserved for global owners, as the
      design's authorization section asks: providers do not scope volume IDs to atespaces, so an
      atespace editor could otherwise name storage another atespace uses. Viewers get and list,
      editors delete.

      - `kubectl ate {create,get,delete} externalvolume`, docs.



  - link: https://github.com/agent-substrate/substrate/pull/3544
    shortDescription:
      - 'atelet: upload the snapshots of a burst of detaches a few at a time'
    description: >-
      When a node fills up, every resume of an actor on it detaches the actor first, and each detach
      uploads the actor's snapshot. Those uploads all ran at once, shared the object store's
      bandwidth and timed each other out at the upload budget, so the detaches failed and the
      resumes answered Internal:

          DetachFromFullNode: while calling atelet DetachActor: ... while uploading snapshot manifest: DeadlineExceeded

      A Detach call's upload now takes one of as many slots as there are detach workers, so a burst
      of calls uploads a few snapshots at a time, as the background detaches already do. The other
      uploads wait for a slot, and an upload's timeout starts once it has one.


      Independent of #3532, which makes the timeout retryable. Both add a test to `detach_test.go`,
      so the second to merge needs a rebase.


      `TestTrackerDetachUploadsAFewAtATime` fails without the change. The snapshottracker tests pass
      with `-race -count=3 -shuffle=on`. On a loaded microVM cluster, 128 of 2304 and 182 of 3072
      resumes failed this way before the change and 0 of 8448 after, with restore times unchanged.


      Written with Claude Code: it found the burst in the api-server logs and wrote the change and
      the test.

    shortDescription:
      - 'atelet, hardware: use `runsc cpu-features --bitmask` and remove hardcoded CPU feature tables'
    description: >-
      `atelet` currently probes a gVisor runtime's CPU features by running `runsc cpu-features` and
      mapping the printed feature names to bit numbers through hardcoded per-architecture tables in
      `internal/hardware/cpufeatures_table.go` (`EncodeCPUFeatures`). Whenever gVisor adds a new CPU
      feature, `EncodeCPUFeatures` rejects the unknown name until the table in Substrate is manually
      updated.


      gVisor added `runsc cpu-features --bitmask` in https://github.com/google/gvisor/pull/16074
      (`google/gvisor@3fdb673dc0a3`, first released in `20261026.0`), which outputs the feature set
      directly as comma-separated `0x%08x` `uint32` block bitmasks using the same feature bit
      numbering as `cpu_features`.


      Since `ateworker-gvisor` already requires gVisor release `20261026.0` or newer:

      - Update `atelet` to run `runsc cpu-features --bitmask` and encode the block bitmasks into the
      existing canonical hex `cpu_features` value so existing snapshots keep matching.

      - Remove `internal/hardware/cpufeatures_table.go`, `EncodeCPUFeatures`, and
      `DecodeCPUFeatures`.

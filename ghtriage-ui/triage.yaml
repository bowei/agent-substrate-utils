  - link: https://github.com/agent-substrate/substrate/issues/3876
    shortDescription:
      - Per-actor environment variables
    description: >-
      ## Problem


      `Actor` has no field for per-actor environment variables or configuration
      overrides.`Container.env` is defined only on `ActorTemplate` (`api/ateapi/v1/ateapi.proto`). 


      Workloads often share an `ActorTemplate` (same container image, resource limits, and volume
      layout) while needing distinct non-secret configuration per `Actor`, such as a session ID,
      tenant or project name, model name, or feature flags. Today, varying any environment variable
      across actors requires creating a separate `ActorTemplate` per actor, which duplicates
      template records and golden snapshot builds.


      ## Constraint: `SNAPSHOT_FIDELITY_MEMORY` snapshots


      As noted in `docs/reference/api-guide.md` (`SystemInfo Volumes`) and #1449:


      - When a container starts during golden snapshot initialization, its process environment
      (`envp`) is copied into the process address space and cached by the language runtime
      (`os.Environ`, `process.env`, `os.environ`).

      - When an actor restores from a `SNAPSHOT_FIDELITY_MEMORY` snapshot (the default for golden
      snapshots and `source_tag` clones), both `ateworker-gvisor` (`runsc restore`) and
      `ateworker-microvm` (`restoreMemoryFidelity`) resume the checkpointed process memory directly.
      No new container process is spawned, so changes to the OCI bundle's `process.env` have no
      effect on already-running processes.


      By contrast, cold boots (`GOLDEN_SNAPSHOT_MODE_DISABLED`) and `SNAPSHOT_FIDELITY_VOLUMES` or
      `SNAPSHOT_FIDELITY_ROOTFS` restores start fresh container processes from the OCI spec built by
      `atelet` (`prepareOCIBundles` -> `ocispec.Build`).


      ## Options to explore


      ### Option 1: Per-actor `env` overrides for cold-boot and non-memory restores


      Allow `Actor` to specify per-container `EnvVar` overrides that `workloadSpecFromActorTemplate`
      (`cmd/ateapi/internal/controlapi/workload_spec.go`) merges over
      `ActorTemplate.containers[].env` (with actor values taking precedence over template values,
      which take precedence over the image `ENV` in `resolveActorEnv`).


      Open question on `SNAPSHOT_FIDELITY_MEMORY` interactions:

      - Reject actor-level `env` on `CreateActor` if the actor initializes from a
      `SNAPSHOT_FIDELITY_MEMORY` golden snapshot or `source_tag`?

      - Or automatically downgrade the initial restore of a golden snapshot / `source_tag` from
      `SNAPSHOT_FIDELITY_MEMORY` to `SNAPSHOT_FIDELITY_ROOTFS` when actor `env` overrides are set,
      preserving the warmed rootfs while starting fresh container processes with the actor's
      environment?


      ### Option 2: Project per-actor key-value configuration via `SystemInfoVolumeSource`


      `SystemInfoVolumeSource` files are regenerated on the host by `atelet` on every `Run` and
      `Restore` and excluded from checkpoints (#802). Extending `Actor` with a bounded key-value map
      (or building on `annotations` in #3617) and projecting those entries into the `systemInfo`
      volume (for example as individual files or a dotenv file under `/run/ate/...`) works across
      `SNAPSHOT_FIDELITY_MEMORY` restores without losing memory restore speed.


      Workloads that read `/run/ate/...` on wakeup (or via a `PostResume` hook from #450, or a guest
      process runner like `ate-env` before spawning child processes) can load per-actor
      configuration after a memory restore.


      ## Related issues


      - #802 (`SystemInfo` volume source)

      - #1449 (Golden snapshot state pollution)

      - #2335 (Per-actor restore-time credential projection via `SystemInfo`)

      - #3617 (Annotations on `Actor` and `ActorTemplate`)

      - #1051 (`Actor` -> `ActorTemplate` relationship)

      - #450 (Actor lifecycle hooks)

  - link: https://github.com/agent-substrate/substrate/issues/3771
    shortDescription:
      - Improve Substrate Image Pull Speed
    description: >-
      # Improve Substrate Image Pull Speed


      ## Background


      The current image pull on Substrate seems to hover around \~40 MB/s to \~70 MB/s (depending on
      node machine type). For example, across 15 runs, on a c3-standard-4 node, pulling a \~3 GB
      image from Google Artifact Registry in the same region (us-west1) as the cluster “cold” (from
      a node that has none of the layers in the cache) took a median of 52.5s \[51.2-54.9\]
      ([recorded from
      slog](https://github.com/agent-substrate/substrate/blob/29e202961f72d896a5c7cd837036ebc9e058e485/internal/imagecache/imagecache.go#L666)).
      This corresponds to a **throughput of \~58.5 MB/s, which is about 2% of the network
      bandwidth**. We observe similar results
      [here](https://docs.google.com/document/d/1-T8NLSJ8vZgz8rC-GRWCcKO_4-CjsaM_2d4TXKklHiY/edit?tab=t.t0rtnd1ibbt3)
      (even when using 100 GB pd-ssd, 300 GB pd-ssd, and e2 nodes).&nbsp;


      ## Optimizations&nbsp;


      Optimizations will be landed incrementally, focusing on the single image case since latency
      improvements here should translate to the multilayer case as well.&nbsp;


      1. [PR \#1](https://github.com/agent-substrate/substrate/pull/3749): Longest processing time
      (LPT) scheduling so that the largest layer never queues behind smaller layers&nbsp;  

      2. [PR \#2](https://github.com/agent-substrate/substrate/pull/3759): For each file,
      unpackLayer performs 6 separate path-based filesystem lookups though os.Root and allocates a
      new 32 KiB buffer on the Go heap, remove 4 redundant walks and reuse the existing
      buffer&nbsp;  

      3. [PR \#3](https://github.com/agent-substrate/substrate/pull/3753/changes): Swap
      stdlib/compress/gzip with klauspost/compress/gzip


      **Atelet Restore Total over 25 Reps&nbsp;**


      | Variant | Median | Δ vs main | Mean | Min–Max | Stdev | p vs main |

      | :---- | :---- | :---- | :---- | :---- | :---- | :---- |


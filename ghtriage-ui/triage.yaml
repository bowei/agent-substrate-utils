    shortDescription:
      - 'atenet: add --in-progress-resume-budget flag'
    description: >-
      ## Summary


      When an ingress wake arrives while an actor is still completing an overlapping suspend,
      ate-api-server answers `ResumeActor` with `codes.Aborted` (while the suspend holds the actor
      lease) or `codes.FailedPrecondition` reporting `ACTOR_STATE_SUSPENDING`. Either response can
      exhaust a short `--parked-request-budget` during checkpoint upload or fail immediately without
      retrying.


      - Adds `--in-progress-resume-budget` (0 by default) on atenet-router so positive values retry
      `ACTOR_STATE_SUSPENDING` alongside `codes.Aborted` for up to `max(--parked-request-budget,
      --in-progress-resume-budget)`, capping post-budget retry intervals at 2 s and extending
      Envoy's external processor message timeout and derived drain timeout to match.

      - Arms the worker-pool capacity saturation deadline (`codes.ResourceExhausted` /
      `codes.Unavailable`) lazily on its first occurrence so pool-full shedding stays bounded by
      `--parked-request-budget` without starving post-suspend retries.


      ## Verification


      - `go test -race -count=3 -shuffle=on ./cmd/atenet/...`
      (`TestActorResumer_InProgressBudgetExtendsPastParkBudget`,
      `TestParkedRequestConfig_ExtProcHold` via `testing/synctest`)

      - `./hack/verify/boilerplate.sh && ./hack/verify/gofmt.sh && ./hack/verify/package-deps.sh`


      🤖 PR was made with the use of generative AI.

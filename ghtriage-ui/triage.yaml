  - link: https://github.com/agent-substrate/substrate/pull/3852
    shortDescription:
      - 'atelet: stage default sandbox runtime into worker directory and remove runtimePrewarmer'
    description: >-
      Fixes #3279


      `gvisorCPUFeatures` skipped staging when `cpuFeatures` already held the `runsc` digest.
      Promoting an evicted restorable gVisor version to `defaultVersion` while object storage was
      unreachable wrote an uncached runtime to `sandbox-runtimes.json` and unlinked the previous
      default.


      `buildFile` also staged microVM defaults into a scratch directory and removed those links
      before `runtimePrewarmer` linked `workers/<uid>/default-runtime/<hash>` on a second queue.
      Cache GC could evict the default in that window once an entry passed
      `--sandbox-asset-cache-min-age`, and every re-sync repeated the scratch links.


      `stageDefault` now stages the default version into `workers/<uid>/default-runtime/<hash>` via
      `ensureSandboxAssets` during `buildFile`. A populated directory stats each asset once, and an
      evicted asset is fetched and linked before `write` updates `sandbox-runtimes.json` and
      `pruneDefaultRuntimeDirs` removes retired defaults. `stageScratch` verifies restorable
      versions once per bundle hash in `verifiedBundles` for both gVisor and microVM, and runs the
      `runsc` CPU-feature probe from a scratch link outside the worker directory.


      `runtimePrewarmer` and `stageSandboxAssets` have no remaining callers and are removed.


      AI-assisted, I reviewed and tested it.

      <!-- Breaking change? Describe what users must do on upgrade and ask for the `breaking-change`
      label. -->



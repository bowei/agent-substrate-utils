    shortDescription:
      - 'microvm: Run virtiofsd without a thread pool to fix flakes'
    description: >-
      The failed jobs: #2648 ([job
      122190028560](https://github.com/agent-substrate/substrate/actions/runs/40504440980/job/122190028560))
      and #2953 ([job
      122190494976](https://github.com/agent-substrate/substrate/actions/runs/40504576601/job/122190494976)).
      The same signature on 10-22 ([run
      39846273019](https://github.com/agent-substrate/substrate/actions/runs/39846273019)) and 10-26
      ([run 40397737394](https://github.com/agent-substrate/substrate/actions/runs/40397737394)).


      On the micro-VM runtime an actor runs as a small VM, and a helper called virtiofsd serves its
      files from the host. To pause an actor the worker snapshots the VM: Cloud Hypervisor freezes
      it, asks each device including virtiofsd to write down its state, then dumps the guest memory.
      In both failures the restored app died on its first file read with "bad file descriptor", the
      error virtiofsd returns for a file handle it has never seen. The snapshot had hit the middle
      of that read.


      A thread pool caused it. The worker ran virtiofsd with one worker thread doing the real work,
      and the snapshot never waited for it. On a busy CI runner that thread finished the file open
      after virtiofsd had saved its state, but its answer still reached guest memory, which Cloud
      Hypervisor dumps last. The restored VM remembered a handle the restored virtiofsd did not.
      When the team slowed that thread on purpose, the bug appeared nearly every time; when the
      answer came even later, the program waited forever.


      One flag fixes it: no pool. The thread that takes a request then also finishes it, holding the
      lock the snapshot needs, so the snapshot waits instead of racing. The same slowdown on the
      fixed build lost nothing, with checkpoint and restore times unchanged. Someone had copied the
      pool setting from kata's config; virtiofsd itself defaults to no pool.


      AI use: AI-assisted, I reviewed and tested it.


      - [x] Tests pass

      - [x] Docs updated (no doc mentions the flag)

    description: >-
      ## Summary


      Concurrent snapshot transfers for the same actor triggered duplicate STS token exchanges in
      `gcsissuer.Issuer` without retry on HTTP 429 or 5xx responses, while exchangeclient pinned
      each node's gRPC channel to a single ate-api-server replica via default `pick_first` load

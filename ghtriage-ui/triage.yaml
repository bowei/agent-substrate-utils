  - link: https://github.com/agent-substrate/substrate/pull/3369
    shortDescription:
      - >-
        ateapi: release external snapshots before terminating atelet in DeleteActor and retry stuck
        deletions
    description: >-
      `DeleteActor` previously terminated the workload on `atelet` and released the worker before
      releasing external snapshots. When an actor had only a node-local pending snapshot and
      external snapshot cleanup failed, the local checkpoint was destroyed while the actor remained
      stuck in `ACTOR_STATE_DELETING`. In addition, uncommitted snapshots called `CleanupSnapshot`
      even when no external snapshot was completed.


      Fixes #3274


      ## Summary


      ```text

      DeleteActor
        ensureExternalSnapshotsReleased (runs before local teardown; skips CleanupSnapshot when no completed external snapshot exists)
        ensureAteletTerminated          (gated on external release success)
        ensureWorkerReleased            (gated on external release success)
        PurgeActor

      ActorGCReconciler
        polls ListActors(ACTOR_STATE_DELETING) and retries DeleteActor with backoff
      ```


      ## Evidence


      - **Before:** Deleting a newly created or suspended actor without a completed external
      snapshot invoked `CleanupSnapshot` and left the actor stuck in `ACTOR_STATE_DELETING` after
      destroying the local checkpoint on transient/permission errors.

      - **After:** `DeleteActor` releases external snapshots before terminating `atelet`, skips
      `CleanupSnapshot` when no external snapshot completed, maps object-store HTTP 401/403
      responses to `PermissionDenied`, and retries stuck `ACTOR_STATE_DELETING` actors via
      `ActorGCReconciler`.


      ## Merge Danger


      **Door:** Two-way


      **Blast Radius:** Small (`cmd/ateapi/internal/controlapi` deletion workflow and background GC
      reconciler)


      AI use: AI-assisted implementation and unit tests; reviewed and verified by @moficodes on Kind
      and GKE.


      - [x] Tests pass

      - [ ] Docs updated

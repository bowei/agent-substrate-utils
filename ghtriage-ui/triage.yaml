  - link: https://github.com/agent-substrate/substrate/pull/3531
    shortDescription:
      - Bump pgx to v5.12.0
    description: >-
      Fixes the store read-timeout flake, the top CI flake of the last two weeks.


      A query fails with `timeout: read tcp ...:5432: i/o timeout` while its own context is still
      live. ate-api-server answers Internal, and the e2e run sees one of:


      - a lifecycle step fails, `workflow failed at step FinalizeRunning: while updating actor: ...
      i/o timeout` (also `MarkSuspending`), so a resume or suspend returns Internal

      - a restore fails and the actor is CRASHED: the worker asks the egress gateway for the actor
      certificate, the gateway asks ate-api-server to mint it, and that read of the actor or worker
      times out

      - a golden snapshot upload fails with `GoldenActorCrashed: ... while minting the actor JWT
      ...: i/o timeout`, so the template never gets its golden

      - `CreateActor` fails with `getting tag ...: i/o timeout`


      Counts from read-only scans of pr-workflow runs: 9 failed e2e jobs from 2026-10-28 to
      2026-11-01 (two in the merge queue, one on a main push), 3 the day before, 4 in the three days
      before that. 8 of the 9 recent jobs were on the microVM step, the most loaded one. Tests hit:
      `TestSandboxCrashIsReported`, `TestUpdateTemplateLifecycle`, `TestDurableDirLifecycle`,
      `TestMultipleDurableDirLifecycle`, `TestActorLifecycle/PauseResumeActor`,
      `TestActorEgressMITMTrust`, `TestActorEgressPolicyDeniesUnlistedHost`,
      `TestActorSizing_SandboxObservesDeclaredLimits`, `TestRevertActorToMostRecentDurableSnapshot`.
      Examples: [merge queue,
      FinalizeRunning](https://github.com/agent-substrate/substrate/actions/runs/40730867269/job/122966489165),
      [main push, restore
      crash](https://github.com/agent-substrate/substrate/actions/runs/40777623003/job/123130876119),
      [merge queue, restore
      crash](https://github.com/agent-substrate/substrate/actions/runs/40820753322/job/123272419611).


      The cause is https://github.com/jackc/pgx/issues/2673. A slow write starts pgx's background
      reader on the connection. If the query's context is canceled at that point, the deadline set
      by the cancellation fails the background read. The query still succeeds from the buffered
      response, but the timeout error stays buffered on the connection. The next query on that
      pooled connection returns it, and pgx closes the connection. That is why the error names no
      context error and hits unrelated RPCs, and why a loaded runner sees it.


      pgx 5.12.0 stops buffering such timeout errors (https://github.com/jackc/pgx/pull/2675). The
      issue's reproducer fails on 5.10.0 and passes on 5.12.0. It also passes on 5.10.0 with only
      that one change applied.


      This is not only a test problem: the same timeout crashes a real actor on a loaded
      ate-api-server. The code sets no read deadline of its own on the Postgres socket, so there was
      no timeout to lengthen.


      Also in 5.10.0 to 5.12.0 (vendored `CHANGELOG.md`):


      - Two advisories fixed: SQL injection in simple-protocol `SendBatch` (GHSA-j38q-h3ph-jjpq) and
      a `require_auth` / `channel_binding=require` bypass (GHSA-95fj-3fxw-g62g). The one `SendBatch`
      here (the outbox poller) uses the default extended protocol, and neither connection setting is
      used.

      - 5.11.0 replaces the `date`, `timestamp` and `timestamptz` text parser and rejects impossible
      dates. The stores use the default exec mode, extended protocol with binary results, so the
      text path is not theirs.

      - pgxpool: background fills of `MinConns` and `MinIdleConns` get a 60 s timeout; canceling
      `Acquire` during a health-check ping returns promptly.

      - `BatchResults` gains `Tx` and `Rows` gains `TypeMap`. The build passes, so nothing here
      implements them.

      - puddle 2.2.3 destroys a resource whose background construction finishes after `Close` or
      `Reset`.


      go.mod, go.sum and vendor only. Build and vet pass on darwin and linux. The store, atepg and
      authz tests pass against Postgres. The go-modules, licenses and package-deps verifiers pass.
      CI is green on the PR.


      Written with Claude Code: it traced the error to the pgx issue, ran the reproducer, prepared
      the bump, and scanned CI for the flake counts.

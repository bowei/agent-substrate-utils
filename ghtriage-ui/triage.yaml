  - link: https://github.com/agent-substrate/substrate/issues/3612
    shortDescription:
      - >-
        gVisor worker: report why a sandbox exited (exit status and last stderr line) in the crash
        message
    description: >-
      ## What happens


      When a template's golden actor crashes because its container's process exits at start, the
      template fails with:


      ```text

      GoldenActorCrashed: golden actor crashed before its snapshot was taken: gVisor sandbox exited

      ```


      The reason the process gave is only in the worker pod's log, in the container's entry. A
      client of the API (we run Stigmer's sandboxes on Substrate) can't read that log: the golden
      actor lives in `ate-golden`, outside the client's atespaces, and the worker's log is reachable
      only through the Kubernetes API. So the client can tell its operator *that* the golden actor
      crashed, but not *why*.


      Our case, measured on v0.6.0: Stigmer's runner checks its image before it starts and exits 78
      with one line on stderr when it can't run, for example:


      ```text

      stigmer runner: this base image cannot run the runner layer: missing from PATH: git. The base
      image needs glibc 2.28 or newer, root, bash, git and standard text tools:
      https://stigmer.ai/docs/guides/self-hosting/runners#bring-your-own-base-image

      ```


      That line is the whole diagnosis, and today it never reaches the template's status.


      ## What v1.0.0-rc.2 already does


      The reconciler now carries the golden actor's crash message into the template's error
      (`cmd/ateapi/internal/controlapi/template_reconciler.go:262-266` at `v1.0.0-rc.2`). Thanks,
      that is half of it.


      ## The ask


      Have the gVisor worker's crash report say why the sandbox exited. Today it's the constant
      `"gVisor sandbox exited"`, or `"killed for exceeding its memory limit"`
      (`cmd/ateworker-gvisor/crash.go:60-63` at `v1.0.0-rc.2`). It would help if it carried:


      - the exiting application container's exit status, and

      - the last line that container wrote to stderr, capped the way the crash message already is.


      With both, the reconciler line above would carry a container's own refusal into every
      template's error, and a client could show its operator the cause without any access to the
      worker's logs. The microVM worker reports an exit status already
      (`cmd/ateworker-microvm/crash.go`); the stderr line would help there too.


      ## Context


      Stigmer's side: https://github.com/stigmer/stigmer/issues/1848 and the pull request that
      closes it, https://github.com/stigmer/stigmer/pull/2933, which in the meantime tells the
      operator where the line is in the worker's log, by the `ate.template.name` label.
    currentLabels:
      - area/api
      - kind/feature
      - area/gvisor
    labels:
      - name: area/observability
        action: ADD
        reason: Surfaces container exit status and last stderr line in crash diagnostics
      - name: area/lifecycle
        action: ADD
        reason: Improves GoldenActorCrashed and actor crash status reporting
  - link: https://github.com/agent-substrate/substrate/issues/3602
    shortDescription:
      - An Actor can fill the node's disk through a DurableDir and crash other actors on that node
    description: >-
      `DurableDir` volume configurations in `ActorTemplate` has no size limit. At runtime, they are
      backed by the node's disk. Nothing in atelet seems to limit what an actor writes there. The
      scheduler is also not aware of the volume requirements so it can place the actor on a worker
      that cannot really host it.


      I would expect that a) each DurableDir volume can declare its max size, b) an Actor is
      guaranteed to have the amount of disk space it (optionally?) asked for and c) an actor that
      hits its limits gets `ENOSPC`.


      @BenTheElder @EItanya

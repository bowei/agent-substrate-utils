  - link: https://github.com/agent-substrate/substrate/pull/3762
    shortDescription:
      - 'fix(atelet): do not create the CSI volume mount target directory'
    description: >-
      Fixes #3755, tracking the v1.1 External Volume epic #3757.


      ## Problem


      The CSI spec for `NodePublishVolume` states:


      > The CO SHALL ensure that the parent directory of this path exists ...

      > Creation of target_path is the responsibility of the SP.


      atelet's `mountExternalVolumes` (`cmd/atelet/volumes.go`) currently calls `os.MkdirAll` on the
      per-volume mount target under `volumes/` before handing it to the plugin as `TargetPath`. A
      driver that strictly follows the spec and fails `NodePublishVolume` when the target path
      already exists therefore cannot be used with atelet.


      ## Change


      - Remove the `MkdirAll` of the volume target path from `mountExternalVolumes`. The CO's
      obligation is only the parent `volumes/` directory, which Run and Restore already create via
      `actordirs.ResetActorDirsKeepingVolumes` before publishing, so nothing else needs to create
      it. Left a comment at the call site explaining the CO/SP split to keep it that way.

      - Update `cmd/atelet/volumes_test.go`:
        - the fake worker plugin now simulates SP-side target creation (as a real driver would) and records whether the target path already existed when the plugin was called (`targetExisted` on `mountCall`);
        - the mount-success test asserts the target did **not** exist at plugin-call time and no longer expects a `0750` directory created by atelet, so a reintroduction of the pre-create would fail the test;
        - the "target directory already exists" test additionally asserts republishing onto a leftover mount point is tolerated;
        - stale comments about who creates the directory were corrected.

      The staging-target path created for `NodeStageVolume` (`internal/volume/csi/plugin.go`) is
      intentionally untouched: the CO is responsible for that directory per the spec.


      ## Testing


      ```

      go test ./cmd/atelet/... ./internal/volume/...

      ok  go.ate.dev/substrate/cmd/atelet 17.586s

      ok  go.ate.dev/substrate/cmd/atelet/internal/snapshottracker 3.793s

      ok  go.ate.dev/substrate/internal/volume/csi 0.042s

      ... (all packages pass)

      ```


      This change was developed with AI assistance, reviewed and tested by me.

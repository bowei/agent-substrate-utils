  - link: https://github.com/agent-substrate/substrate/issues/3775
    shortDescription:
      - 'Design: dead actor detection and crash reporting on the worker'
    description: >-
      ## Context


      Ten open issues report one problem: something inside an actor dies and Substrate does not
      notice, or cannot say why. Each merged step added one signal with its own code path and
      message string: the sandbox exit watch (#2695), the host memory guards (#3106, #3429), the
      dead-cgroup warning (#2258), and the guest OOM watch (#3763). The next step, a container that
      exits while its sandbox lives (#2972), cannot be built the same way: it needs a decision on
      what "dead" means, shared by both runtimes and by every signal.


      This issue is the design for the whole. Two things are settled and not reopened: ateworker
      owns detection (#2211), and `ReportActorCrashed` is the path to ateapi (#2695).


      ## Background


      | Death | gVisor | micro-VM |

      |---|---|---|

      | Sandbox process exits | Detected (#2695) | Detected (#2695) |

      | Sandbox over its host memory limit | Detected (#3106) | Detected (#3429) |

      | Container exits inside a living sandbox (segfault, panic, `exit 1`) | Not detected | Not
      detected (#2972) |

      | Container OOM-killed inside the sandbox | WARN when the cgroup is empty | WARN only, after
      #3763 (#3615) |

      | Guest kernel panic | n/a | Not detected; the guest reboots, the VMM lives |

      | Exit during the wakeup gate | Masked until the probe timeout (#3289) | Same |


      An undetected death costs more than a stale `RUNNING`: the next suspend saves the dead sandbox
      over the last good snapshot and deletes it (#2268). A detected crash prevents that, because
      `SuspendActor` refuses a `CRASHED` actor. Downstream, kagent-dev/kagent#3436 shows the user
      side: a claude-code harness hit its memory limit during `pnpm install`, the worker logged the
      dead cgroup, and the session stayed `ready` for hours.


      ## Design


      ### Flow


      ```
                               per actor, inside ateworker
       ┌─────────────────────────────────────────────────────────────────┐
       │  signals (one goroutine each)                                   │
       │   sandbox pidfd ──────────────┐   exists (#2695)                │
       │   memory guard Killed() ──────┤   exists (#3106/#3429)          │
       │   runsc wait / WaitProcess ───┤   NEW: one per app container    │
       │   GetOOMEvent ────────────────┤   #3763 (micro-VM)              │
       │   guest reboot (VMM) ─────────┘   NEW (micro-VM)                │
       │                 │                                               │
       │                 ▼  first signal wins, under the actor lock      │
       │   ┌─ classify ──────────────┐  exit code, signal, OOM event,    │
       │   │  reason + CrashDetail   │  guard → one CrashReason          │
       │   └───────────┬─────────────┘                                   │
       │               ▼                                                 │
       │   ┌─ collect evidence ──────┐  bounded tails, actor-labelled:   │
       │   │  before teardown        │  console.log, virtiofsd.log,      │
       │   └───────────┬─────────────┘  runsc panic log, stderr tail     │
       │               ▼                                                 │
       │   ┌─ salvage (container exit only) ┐  bounded VOLUMES/ROOTFS    │
       │   │  snapshot, never MEMORY        │  checkpoint; own issue     │
       │   └───────────┬────────────────────┘                            │
       │               ▼                                                 │
       │   teardown ─► final usage record ─► ReportActorCrashed          │
       └─────────────────────────────────────────────┬───────────────────┘
                                                     ▼
            atelet (adds worker identity) ─► ateapi: authorize hosted actor,
            RUNNING ─► CRASHED, store ActorCrash{message, detail}, release
            the worker, emit "Actor crashed", ate.actor.crashes++
      ```


      A planned stop (suspend, delete, shutdown) cancels the waiters; a wait that returns during one
      is dropped, as `watchVM` does today. Waiters start on both the cold-boot and the restore path.


      ### How detection works


      The process wait is the detector; everything else classifies. `runsc wait <container>` and
      kata `WaitProcess` return on every exit with the status: a segfault is 139, a Go panic 2, an
      OOM kill 137. `GetOOMEvent` and the memory guard cannot detect a segfault, but they tell an
      OOM kill (137) apart from a `kill -9` (also 137). The classifier holds a short grace window
      (about one second) so an exit and its OOM event meet before the reason is committed. Inside
      the window the specific reason wins: `MEMORY_LIMIT` over `SANDBOX_EXITED`,
      `CONTAINER_OOM_KILLED` over `CONTAINER_EXITED`. A sandbox death also returns every container
      wait, which is what the window is for. Signals and evidence that arrive after the commit are
      dropped; the report is one per actor. Detection needs no guest log, `dmesg` or journal; the
      micro-VM guest boots the kata-agent as PID 1 and has no journal.


      ### Where the evidence comes from


      The guest's console is already a host file: the kernel writes to `hvc0`, cloud-hypervisor
      appends it to `<VMDir>/console.log`. The OOM killer's report, a kernel panic, and the
      kata-agent's log all land there. Today it is read only on a failed boot and deleted at
      teardown. The classifier reads a bounded tail of `console.log` and `virtiofsd.log` (micro-VM),
      the runsc panic log and the failed command's stderr (gVisor, which needs `--panic-log`), and
      the container's last stderr lines (both), and logs each with actor attributes before the
      cleanup runs.


      ### Decisions


      **1. Death semantics.** An actor is dead when any application container has exited and no
      restart policy applies. Recommended over "last container exit": every actor today is one
      process that matters, and a dead main container with a live sidecar is still a 502. The wakeup
      probe gates start only; it does not define liveness. The template has no container kinds
      today, so an init or sidecar container that completes on purpose also counts as an exit; when
      #1420 models kinds and restarts, "has exited" becomes "has exited and will not restart".


      **1a. Salvage before teardown.** A container exit leaves the sandbox up, so the agent's
      progress is still there: its DurDir files and its rootfs writes. Teardown destroys the rootfs
      writes, and a `CRASHED` actor cannot be suspended, so without a step here that progress is
      lost. On a container exit the worker takes a bounded `VOLUMES` or `ROOTFS` checkpoint before
      teardown, and the crash report carries it as `latestSnapshot`. Never `MEMORY`: a memory
      snapshot of a dead container does not restore (see the test in the comments and #2268). The
      actor still ends `CRASHED`, so the failure is visible; `RevertActor` then puts it on the
      salvaged snapshot and `ResumeActor` cold-boots it with the data in place. The salvage runs
      only for container exits: a dead sandbox has nothing to checkpoint, and a memory-guard kill
      already lost the data. Its fidelity choice, timeout, failure path, storage accounting, and the
      retention of the previous snapshot are a separate issue; this design fixes only the order of
      operations, so step 2 leaves the hook point.


      **2. Report structure.** Three parts to agree:


      - The reasons:


      ```proto

      enum CrashReason {
        CRASH_REASON_UNSPECIFIED = 0;
        // Reported by the worker.
        CRASH_REASON_SANDBOX_EXITED = 1;        // sentry, VMM, or virtiofsd process died
        CRASH_REASON_MEMORY_LIMIT = 2;          // host memory guard killed the sandbox
        CRASH_REASON_CONTAINER_EXITED = 3;      // an application container exited
        CRASH_REASON_CONTAINER_OOM_KILLED = 4;  // killed inside the sandbox for memory
        CRASH_REASON_GUEST_PANIC = 5;           // micro-VM guest kernel panic
        // Raised by ateapi, for the fixed causes in controlapi/crash.go.
        CRASH_REASON_WORKER_LOST = 6;           // worker pod gone or restarted
        CRASH_REASON_WORKER_INELIGIBLE = 7;     // worker draining or no longer eligible
        CRASH_REASON_SNAPSHOT_UNAVAILABLE = 8;  // snapshot or its node missing or in conflict
        CRASH_REASON_OPERATION_FAILED = 9;      // a lifecycle atelet call failed
      }

      message CrashDetail {
        CrashReason reason = 1;
        string container_name = 2;   // for the container reasons
        optional int32 exit_code = 3; // CONTAINER_EXITED; absent if unknown (0 is a real exit)
        int32 signal = 4;            // when the container died by signal
        string last_stderr_line = 5; // capped like message
      }

      ```


      Values carry the enum prefix, per the API style guide. The ateapi-raised reasons cover the
      crashes that happen with no worker report, which are most crashes today; without them the
      reason label would say nothing about them. The message keeps the detail, and
      `ate.actor.operation.name` already names the failed operation.


      - `CrashDetail` is a message beside the free-text `message`, not fields folded into the text:
      a client parses one field, and the event gets the same keys as attributes.

      - It is stored on `ActorCrash`, so `kubectl ate get actor` shows it, and the `Actor crashed`
      event carries it. Both come from the one state commit.


      This gives #3612 its exit code and stderr line, and #1420 the input a restart policy needs.


      **3. Metrics count, logs identify.** No new crash metric. `ate.actor.crashes` gains an
      `ate.crash.reason` label, so `reason="container_oom_killed"` is the OOM-kill count #2427 asks
      for and stays consistent with the other reasons. The `Actor crashed` event carries the actor
      identity and the `CrashDetail`. Both come from the one commit in ateapi, under the same guard,
      so they cannot disagree. The worker logs; ateapi counts.


      **4. Evidence is read at the crash, not streamed.** A continuous tail of the guest console is
      out of scope: it costs log volume, and it raises the question whether an actor's owner sees
      its guest kernel log through `kubectl ate logs`. The tail size is 8 KB; an OOM report is about
      2 KB.


      ### A bug to fix with the detector


      When ateapi declines a report with `NotFound` or `FailedPrecondition`, the worker logs at INFO
      and returns success. A decline is legitimate when a suspend or delete races the crash. In
      #3408 all 194 reports were declined while the actors stayed `RUNNING`, so it hid a
      disagreement about who hosts the actor. One report per actor removes the duplicates; a decline
      that remains is logged at WARN with the returned state and counted in a worker-side
      `ateworker.crash_report.declined{code}`. That is the interim. The fix is #2777: the worker
      reports every actor it runs, and the control plane reconciles against that, so a lost or
      declined report cannot leave a dead actor `RUNNING`.


      ## Plan


      1. Agree the decisions here.

      2. `CrashReason` and `CrashDetail` through atelet and ateapi (#3809), with the existing worker
      signals and the ateapi causes mapped onto them, and `ate.crash.reason` on the counter. First,
      so the detector reports structured from the start. Closes #3612 and #2427.

      3. Container exit watcher on both runtimes (#3728), reporting `CRASH_REASON_CONTAINER_EXITED`
      on the first exit with the exit code, with the salvage hook before teardown, plus the decline
      fix. Closes #2972 and #3289, and the detection half of #2268 and #3615.

      4. Salvage snapshot on container exit, in its own issue (decision 1a). Takes #2268 option 3
      and #1526 with it.

      5. Evidence capture and attribution. Closes #2212 and #2271.

      6. Guest OOM as a reason on the container exit (#3615 step 2) and the guest-panic signal.
      gVisor has no per-container OOM producer yet, so it waits for one.


      ## Out of scope


      - A restart policy (#1420). This design produces its input.

      - Hung sandboxes and liveness while running (#141). A hang produces no exit, so no signal.

      - A per-actor log API (#2043).


      ## Related


      #2211 (tracking) · #2972 · #3615 · #3612 · #3289 · #3408 · #2777 · #2268 · #1526 · #2212 ·
      #2271 · #2427 · #2355 · #3809 (PR, step 2) · #3728 (PR, step 3) · #3763 (PR, step 6) · #1420 ·
      #141 · kagent-dev/kagent#3436

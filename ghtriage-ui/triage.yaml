    shortDescription:
      - 'atelet: a detach whose upload attempt times out is Unavailable'
    description: >-
      Under load many actors on a full node are resumed at once. Each resume detaches the actor
      first, which uploads its snapshot, so dozens of uploads run against the object store at the
      same time. An attempt can run out of its own upload timeout.


      The tracker keeps the local snapshot and retries the upload on the next attempt. But the error
      it returned had no gRPC code, so the detach failed as Internal:

          DetachFromFullNode: while calling atelet DetachActor: ... while uploading snapshot manifest: DeadlineExceeded

      The router answered 500, which the client cannot retry. One case of #646.


      Return Unavailable when the attempt timed out while the caller's context is still live.
      `detachActorError` maps Unavailable to a retryable failure, so the router keeps the request
      parked and retries the resume.


      Written with Claude Code: it found the path in api-server logs and wrote the change and the
      test.

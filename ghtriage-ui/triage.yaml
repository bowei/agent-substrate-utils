      - name: kind/bug
        action: ADD
        reason: >-
          Switches PostgreSQL transactions to Serializable isolation by default to prevent
          concurrency anomalies (#3044)
      - name: area/reliability
        action: ADD
        reason: Eliminates read-committed/repeatable-read transaction races in atepg

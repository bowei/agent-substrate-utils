  - link: https://github.com/agent-substrate/substrate/pull/3488
    shortDescription:
      - 'microVM: keep a container''s rootfs writes on a virtio-blk disk (RootfsUpperDisks preview)'
    description: >-
      Keep a microVM container's rootfs upper on its own virtio-blk ext4 disk, behind the
      `RootfsUpperDisks` preview gate.


      ### Motivation


      Today the upper lives on the host and reaches the guest through the virtio-fs share. Every
      metadata operation in the guest is a FUSE round trip, and every ROOTFS or MEMORY checkpoint
      tars the upper file by file, and the restore untars it. With the gate, the guest mounts the
      overlay itself on a disk, a checkpoint hard-links the disk image, and a restore copies it back
      (a reflink on XFS).


      SWE-perf on a `c3-highcpu-192-metal` node, gate off vs on, from an earlier build of this
      branch (Oct 26, 150 users, 10 min):


      | Metric | virtio-fs, 100 MiB upper | disk, 100 MiB upper | virtio-fs, 0.2 MB upper | disk,
      0.2 MB upper |

      |---|---:|---:|---:|---:|

      | Tasks in 10 min | 468 | 612 | 774, 781 | 733, 736 |

      | ResumeActor p50 / p99 (ms) | 850 / 17,000 | 580 / 990 | 540 / 830 | 550 / 860 |

      | TaskCEL p50 / p99 (s) | 32 / 67 | 27 / 49 | 20 / 29 | 23 / 33 |

      | Worker restore, upper step p95 (ms) | 6,441 (untar) | 0 (reflink) | 12.6 (untar) | 0
      (reflink) |


      With a large upper the disk wins clearly. With an almost empty upper it is slightly slower,
      likely because the guest overlay sits on a virtio-fs lower. That is why it stays behind a
      preview gate.


      Targeting post-GA.


      ### Summary of changes


      - `ext4uuid` (Ben's commit) sets the UUID of an ext4 image copy in Go, so the worker needs no
      e2fsprogs.

      - The empty ext4 image is a new optional SandboxConfig asset, `rootfs-upper-disk` (16 GiB
      sparse, 262,144 inodes, 3.6 KB zstd). `hack/microvm-assets/upper-disk-image.sh` builds it
      reproducibly. Its size is each container's rootfs write limit, and an operator can stage
      another size.

      - Cold boot with the gate copies the asset per container and attaches each copy as a
      virtio-blk disk on PCI segment 1, opened `O_DIRECT`. The kata agent mounts it with `discard`
      and mounts the container's overlay on it, with the image from the share as the lower.
        - `O_DIRECT` keeps the guest's writes out of the host page cache, which counts against the actor's `memory.high` since #3429. With buffered I/O, a 1 GiB write got the actor killed for exceeding its memory limit.
        - `discard` gives the blocks of deleted files back to the host, so the image a snapshot ships holds only live data.
      - A ROOTFS checkpoint powers the guest off first (`DestroySandbox`, the agent as PID 1 syncs),
      so the image holds every write. The disk then needs CH v53 or later. Guests that boot systemd
      keep their upper on the share.

      - A MEMORY snapshot's disks are only consistent with its memory. A ROOTFS restore of one, the
      fallback onto an incompatible runtime from #2880, restores at VOLUMES. `RestoreWorkload` and
      atelet's `Restore` now return the fidelity they restored at, and ate-api-server logs a lower
      one. `docs/reference/api-guide.md` says how to avoid it during a runtime upgrade.

      - A restore puts back whichever form its snapshot has, tar or disk, so the gate can be turned
      off with snapshots in flight.


      ### Testing


      - Unit tests for the image copy and UUID, `copySparse`, power-off retries, the snapshot config
      disk rewrite, the fidelity fallback, and PCI segment and mount options.

      - New e2e `TestRootfsUpperDiskLifecycle` (MEMORY and ROOTFS rows) checks that the container's
      `/` is the guest overlay after boot and after each restore.

      - Ran CI's microVM e2e lane with `ATE_PREVIEW=ALL` on kind on an n2-standard-16 VM with nested
      virtualization: 220 tests pass, 3 unrelated skips. After switching to `O_DIRECT`, reran the
      upper disk and durable dir lifecycle tests: 19 pass.

      - In the guest, the disk is `/dev/vda` at `0001:00:01.0` (PCI segment 1) with discard support,
      and `/` is the guest overlay with its upper on the disk.


      Filesystem operations from a busybox actor (512 MiB, 1 vCPU) on the same VM, time in the guest
      and the image's allocated size on the host:


      | Operation | disk | disk, no `discard` | virtio-fs (gate off) |

      |---|---:|---:|---:|

      | Write a 256 MiB file (s) | 1.73 | 1.70 | 2.27 |

      | Write 8,000 files of 32 KiB (s) | 3.71 | 3.71 | 29.54 |

      | `rm -rf` those files (s) | 0.93 | 0.17 | 2.19 |

      | Image allocated after `rm -rf` | 2.1 MiB | 266 MiB | n/a |


      `discard` costs 0.76 s on that `rm -rf` and returns 264 MiB to the host. A 1 GiB file write
      took 4.3 s on the disk in 2 of 2 runs. With buffered I/O, and with virtio-fs, the same write
      got the actor killed for exceeding its memory limit, which is #3429's `memory.high` throttling
      dirty page cache (gate off, so not this change).


      Five commits, meant to be read in order.


      Fixes #3153


      AI use: An AI coding agent helped write the code, tests and this description, and ran the
      tests above. I reviewed every change.


      - [x] Tests pass

      - [x] Docs updated
    currentLabels: []
    labels:
      - name: kind/feature
        action: ADD
        reason: >-
          Backs microVM container rootfs upper layer with an ext4 virtio-blk disk behind
          RootfsUpperDisks preview gate
      - name: area/microVM
        action: ADD
        reason: Avoids virtio-fs metadata overhead and tar/untar during microVM checkpoint/restore
      - name: area/storage
        action: ADD
        reason: Snapshots rootfs upper layer as a block disk image
  - link: https://github.com/agent-substrate/substrate/pull/3475
    shortDescription:
      - 'atepg: Switch to Serializable isolation level for transactions by default'
    description: >-
      As discussed in the community meeting, and in issue #3044, we need to switch to using
      Serializable isolation by default before 1.0.


      Summarizing the arguments so that they are available in the commit history:

      * It is actually quite difficult to write fully correct applications using Read Committed or
      Repeatable Read isolation levels.  Even Google doesn't try (we set both internal and external
      Spanner to default to "External Consistency", which is even stronger than Serializable).

      *  We have not explicitly audited for correctness at the default Read Committed isolation
      level, so it is very likely that there are currently subtle correctness bugs in our
      implementation that will only be revealed under high load.


      Individual code paths can use downgraded consistency levels once we have audited their use of
      locking or other correctness strategies.  Maintaining this auditing will be a heavy ongoing
      commitment, so we should only do it in places where it truly matters for performance (which
      might end up being nowhere).


      The primary side-effect of upgrading from Read Committed to Serializable is that, when there
      are *n* racing transactions that touch the same rows, it is possible for all but one of them
      to fail with a conflict error.  The losing clients must then retry their read-modify-write
      loops.


      Most of the complication in this change comes from ResumeActor, which is covered by a test
      (TestResumeActor_ConcurrentOntoOneWorker) that checks that, of 128 concurrently resumed actors
      targeting a single worker, *none* fail with a conflict error.  This test seems like a bad
      idea, it will always be possible for it to flake.  And as a matter of system/production
      hygiene, retry loops should almost always be driven from the outermost client (the client
      calling the Substrate API in this case).  However, I've preserved the existing behavior for
      now, which required adding some additional retry loops in the workflow, and cleaning up some
      error wrapping so that store-layer conflict errors properly reach the workflow code.


      Fixes #3044 


      AI use: AI-assisted, I reviewed, heavily edited, tested, and debugged.


      This change is not breaking.  Enjoy the same great Substrate flavor you know and love, with
      fewer heart-stopping data-loss incidents.

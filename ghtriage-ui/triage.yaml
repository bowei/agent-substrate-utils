  - link: https://github.com/agent-substrate/substrate/pull/3734
    shortDescription:
      - Refresh PostgreSQL lease expiry after acquisition lock waits
    description: >-
      `AcquireLease` can return an already expired lease after waiting for a row lock longer than
      its TTL. A second caller can then acquire the same key while the first caller's lease Context
      remains live. A conflicting uncommitted insert that rolls back has the same effect.


      Acquire the row and refresh its expiry with `pgx.SendBatch`, using one transaction and one
      pool connection. Check commit completion before returning the lease. Regressions cover both
      lock paths, cancellation, single-connection pools and commit failure.


      This adds one UPDATE per successful acquisition. A local PostgreSQL probe measured roughly 53%
      more WAL per acquisition/release pair; production throughput remains to be measured. Related:
      #3567's lease tests and #3475's isolation change. The defect also reproduces with Serializable
      isolation.


      Validation: both lock-wait regressions fail on main; all five cases pass three race/shuffle
      runs. The lease/store contract suite passes with race detection against PostgreSQL. Full
      repository checks were exercised; unrelated Docker, privileged and WSL networking cases have
      documented environment failures. All 18 verifiers have passing direct or equivalent checks.


      AI use: Codex assisted with implementation, PostgreSQL reproductions, regression testing and
      source review.


